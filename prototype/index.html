/* ═══════════ 设置与密码锁屏（原型 mock：密码/时长仅存 localStorage，实际实现应存服务端哈希 + 会话令牌） ═══════════ */
const LOCK = {
  PWD_KEY:'lcb-proto-pwd', MINS_KEY:'lcb-proto-lock-mins',
  pwd:'123456', mins:1800,          // 无操作锁屏时长（分钟），默认 30 小时
  unlocked:false, lastActive:Date.now(),
  load(){ try{
    this.pwd = localStorage.getItem(this.PWD_KEY) || '123456';
    const raw = localStorage.getItem(this.MINS_KEY);
    if (raw !== null){ const m = Number(raw); if (Number.isFinite(m) && m >= 0) this.mins = m; }
  }catch{} },
  savePwd(p){ this.pwd = p; try{ localStorage.setItem(this.PWD_KEY, p); }catch{} },
  saveMins(m){ this.mins = m; try{ localStorage.setItem(this.MINS_KEY, String(m)); }catch{} },
  isDefault(){ return this.pwd === '123456'; },
};
LOCK.load();
const minsText = (m)=> m>=60 ? (m/60)+' 小时' : m+' 分钟';

const lockPage = ()=>{
  LOCK.unlocked = false;
  $('#lockPwd').value = ''; $('#lockErr').textContent = '';
  $('#lockMask').hidden = false;
  setTimeout(()=> $('#lockPwd').focus(), 60);
};
const tryUnlock = ()=>{
  if ($('#lockPwd').value === LOCK.pwd){
    LOCK.unlocked = true; LOCK.lastActive = Date.now();
    $('#lockMask').hidden = true;
    if (LOCK.isDefault()) guideChangePwd();
    else toast('✅ 已解锁');
  } else {
    $('#lockErr').textContent = '密码错误，请重试';
    const card = $('.lockcard');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  }
};
$('#lockUnlock').onclick = tryUnlock;
$('#lockPwd').onkeydown = (e)=>{ if (e.key==='Enter') tryUnlock(); };

/* 修改密码弹窗（guided=true：仍为默认密码时的强制引导） */
const pwdModal = (guided)=>{
  openModal({
    title: guided?'安全提示：请修改默认密码':'修改配置页密码',
    width:'min(440px,92vw)', closeOnMask:!guided,
    body:`
      ${guided?'<div class="banner warn" style="margin-bottom:12px"><span>当前仍在使用默认密码 <b>123456</b>。同一内网的其他人可能通过「你的内网 IP + 端口」直接打开配置页查看信息，请立即修改密码。</span></div>':''}
      ${guided?'':`<label class="fld">当前密码</label><input type="password" id="pwOld" autocomplete="off">`}
      <label class="fld">新密码（≥6 位，不能是 123456）</label><input type="password" id="pwNew" autocomplete="off">
      <label class="fld">确认新密码</label><input type="password" id="pwNew2" autocomplete="off">
      <div class="lock-err" id="pwErr" style="margin-top:6px"></div>
      <div class="mini-note">密码用于保护本机配置页（含会话页）。原型演示存于浏览器本地；实际实现应存服务端哈希并配合会话令牌。</div>`,
    foot:`${guided?'<button class="btn" id="pwSkip">暂不修改</button>':''}<span class="sp"></span><button class="btn primary" id="pwOk">确认修改</button>`,
  });
  const sk = $('#pwSkip');
  if (sk) sk.onclick = ()=>{ closeModal(); toast('已跳过。下次仍用默认密码进入时会再次提醒', true); };
  $('#pwOk').onclick = ()=>{
    const oldv = guided ? LOCK.pwd : ($('#pwOld') ? $('#pwOld').value : '');
    const n1 = $('#pwNew').value, n2 = $('#pwNew2').value, err = $('#pwErr');
    const bad = (m)=>{ err.textContent = m; return false; };
    if (!guided && oldv !== LOCK.pwd) return bad('当前密码不正确');
    if (n1.length < 6) return bad('新密码至少 6 位');
    if (n1 === '123456') return bad('新密码不能是默认密码 123456');
    if (n1 !== n2) return bad('两次输入的新密码不一致');
    LOCK.savePwd(n1);
    closeModal();
    toast('✅ 密码已修改，下次登录请使用新密码');
  };
};
const guideChangePwd = ()=> pwdModal(true);

/* 设置弹窗（顶栏右上角 ⚙） */
const settingsModal = ()=>{
  const opts = [[30,'30 分钟'],[60,'1 小时'],[240,'4 小时'],[1440,'24 小时'],[1800,'30 小时'],[0,'永不']];
  openModal({
    title:'设置', width:'min(460px,92vw)',
    body:`
      <div class="sub-title">配置页密码</div>
      <div class="mut" style="font-size:12px;margin-bottom:10px">防止同一内网其他用户通过「IP + 端口」查看你的配置信息；每次进入配置页都需要输入密码${LOCK.isDefault()?'。<b style="color:var(--warn-tx)">当前仍为默认密码 123456，建议立即修改。</b>':'。'}</div>
      <button class="btn" id="stPwd">${I(IC.key,13)} 修改密码</button>
      <hr>
      <div class="sub-title" style="margin-top:4px">自动锁屏</div>
      <label class="fld">长时间无操作后锁屏（再次使用需输入密码）</label>
      <select id="stMins">${opts.map(([v,l])=>`<option value="${v}" ${LOCK.mins===v?'selected':''}>${l}</option>`).join('')}</select>
      <div class="mini-note" style="margin-top:8px">当前设定：${LOCK.mins?`无操作 ${minsText(LOCK.mins)} 后自动锁屏`:'不自动锁屏'}。演示提示：可临时选「30 分钟」，或点顶栏 🔒 立即体验锁屏。</div>`,
    foot:`<span class="sp"></span><button class="btn" id="stCancel">关闭</button><button class="btn primary" id="stSave">保存</button>`,
  });
  $('#stCancel').onclick = closeModal;
  $('#stPwd').onclick = ()=> pwdModal(false);
  $('#stSave').onclick = ()=>{
    const v = Number($('#stMins').value);
    LOCK.saveMins(v);
    closeModal();
    toast(v?`✅ 已设置：无操作 ${minsText(v)} 后自动锁屏`:'✅ 已关闭自动锁屏');
  };
};
$('#settingsBtn').onclick = settingsModal;
$('#lockBtn').onclick = lockPage;

/* 锁屏看门狗：每 30 秒检查一次无操作时长 */
['mousemove','keydown','click','wheel','touchstart'].forEach(ev=> document.addEventListener(ev, ()=>{ LOCK.lastActive = Date.now(); }, {passive:true}));
setInterval(()=>{
  if (!LOCK.unlocked || !LOCK.mins) return;
  if (Date.now() - LOCK.lastActive > LOCK.mins*60000){ lockPage(); toast('已因长时间无操作自动锁屏', true); }
}, 30000);

/* ═══════════ 启动 ═══════════ */
/* 每次渲染用全新 #view 节点，避免页面级监听跨渲染叠加 */
const _baseRender = render;
render = function(){
  const v = $('#view');
  if (v){ const nv = v.cloneNode(false); v.replaceWith(nv); }
  _baseRender();
};

/* 主题切换 */
const themeBtn = $('#themeBtn');
const setTheme = (t)=>{
  document.documentElement.dataset.theme = t;
  themeBtn.innerHTML = I(t==='dark'?IC.sun:IC.moon, 15);
  try{ localStorage.setItem('lcb-proto-theme', t); }catch{}
};
themeBtn.onclick = ()=> setTheme(document.documentElement.dataset.theme==='dark' ? 'light' : 'dark');
let _savedTheme = null; try{ _savedTheme = localStorage.getItem('lcb-proto-theme'); }catch{}
setTheme(_savedTheme || 'light');

/* 顶栏按钮图标 + 进页即锁（每次进入配置页都需输密码） */
$('#settingsBtn').innerHTML = I(IC.settings, 15);
$('#lockBtn').innerHTML = I(IC.lock, 14);
lockPage();

window.addEventListener('hashchange', render);
SaveBar.init(snapshotDB, render);
render();
</script>
