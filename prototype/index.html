<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>飞书 Claude Code 桥接器 · 配置台（重构原型）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233370ff'/%3E%3Cg stroke='%23fff' stroke-width='1.9' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 7 5.5 9.5 8 12'/%3E%3Cpath d='M5.5 9.5H15'/%3E%3Cpath d='M16 12 18.5 14.5 16 17'/%3E%3Cpath d='M18.5 14.5H9'/%3E%3C/g%3E%3C/svg%3E">
<!--
  ══════════════════════════════════════════════════════════════
  配置台重构原型 · 纯静态 Mock，不依赖后端，浏览器直接打开即可
  相对现有 assets/web 的主要改动（供评审对照）：
  1. 侧边栏按「总览 / 机器人接入 / 模型与扩展 / 安全与记忆」分组
  2. 统一卡片语法：panel = 标题(≤1行说明) + 操作区 + 内容，
     长文案收进 ⓘ 悬浮提示或「高级」折叠
  3. 概览改为状态看板：4 张状态瓦片 + 快捷操作，2 秒可判读
  4. 应用编辑抽屉：顶部横向 Tab（基本信息/机器人角色/模型/触发词/
     环境变量）；人格并入基本信息；抽屉左缘可拖拽调宽
  5. Claude 认证 / 插件 / 记忆增强等长页改为页内 Tab 拆分
  6. 需重启生效的配置项统一挂「需重启」角标
  7. 未保存改动统一为底部悬浮保存条（还原 / 保存）
  ══════════════════════════════════════════════════════════════
-->
<style>
/* ═══ Tokens ═══ */
:root{
  color-scheme:light;
  --bg:#f3f5f9; --card:#fff; --field:#fff; --sunk:#f6f8fb;
  --border:#e4e8f0; --border2:#cfd6e4;
  --ink:#1c2333; --mut:#697180; --faint:#9aa3b4;
  --pri:#3370ff; --pri-h:#2b5fe3; --pri-w:#edf3ff; --pri-ring:rgba(51,112,255,.18);
  --ok:#1f9d55; --ok-bg:#e7f6ec; --ok-tx:#177c43;
  --warn:#d97706; --warn-bg:#fdf3e2; --warn-tx:#a85d03;
  --err:#e5484d; --err-bg:#fdecec; --err-tx:#c7363b;
  --off-bg:#eef0f5; --off-tx:#7a8294;
  --code-bg:rgba(28,35,51,.06);
  --mono:"JetBrains Mono","SF Mono",Consolas,"Cascadia Mono",Menlo,monospace;
  --r:12px; --r-s:8px;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --shadow-2:0 10px 32px rgba(16,24,40,.14);
  --header-bg:rgba(255,255,255,.86);
  --nav-w:212px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1218; --card:#161b26; --field:#10141d; --sunk:#1a2030;
  --border:#272e3f; --border2:#3a4358;
  --ink:#e8ebf2; --mut:#98a1b3; --faint:#6b7488;
  --pri:#4d80ff; --pri-h:#6996ff; --pri-w:rgba(77,128,255,.15); --pri-ring:rgba(77,128,255,.3);
  --ok:#43c072; --ok-bg:rgba(46,161,33,.14); --ok-tx:#5ad286;
  --warn:#f09d3e; --warn-bg:rgba(255,136,0,.12); --warn-tx:#ffb45e;
  --err:#ff7076; --err-bg:rgba(229,72,77,.14); --err-tx:#ff8f94;
  --off-bg:rgba(255,255,255,.06); --off-tx:#98a1b3;
  --code-bg:rgba(255,255,255,.09);
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-2:0 10px 32px rgba(0,0,0,.5);
  --header-bg:rgba(17,21,29,.86);
}

/* ═══ Base ═══ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font:13.5px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink);
}
::selection{background:var(--pri-w)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
a{color:var(--pri);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:var(--mono);font-size:.9em;background:var(--code-bg);border-radius:5px;padding:1px 5px;word-break:break-all}
h1,h2,h3,h4{margin:0;font-weight:650}
button{font:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:4px}

/* ═══ Header ═══ */
.topbar{
  height:54px; padding:0 20px;
  display:flex; align-items:center; gap:12px;
  background:var(--header-bg);
  -webkit-backdrop-filter:blur(14px) saturate(1.4); backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{
  width:28px;height:28px;border-radius:8px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#3370ff,#7c5bff 130%);
  box-shadow:0 2px 8px rgba(51,112,255,.32);
}
.brand h1{font-size:14.5px;letter-spacing:.01em;white-space:nowrap}
.pill{
  font-size:11.5px;color:var(--mut);background:var(--card);
  border:1px solid var(--border);border-radius:999px;padding:1px 10px;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.topbar .sp{flex:1}
.theme-btn{
  width:32px;height:30px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--mut);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:color .15s,border-color .15s;
}
.theme-btn:hover{color:var(--ink);border-color:var(--border2)}

/* ═══ Layout / Sidebar ═══ */
.layout{display:flex;min-height:calc(100vh - 54px)}
.sidenav{
  width:var(--nav-w);flex:0 0 auto;
  padding:14px 10px 28px;
  position:sticky;top:54px;align-self:flex-start;
  max-height:calc(100vh - 54px);overflow-y:auto;
}
.nav-search{position:relative;margin:0 4px 12px}
.nav-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.nav-search input{
  width:100%;padding:7px 10px 7px 30px;font:inherit;font-size:12.5px;
  border:1px solid var(--border);border-radius:var(--r-s);
  background:var(--field);color:var(--ink);
}
.nav-search input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-ring)}
.nav-group{margin-bottom:6px}
.nav-group-label{
  font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.06em;
  padding:10px 12px 4px;white-space:nowrap;
}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:7px 12px;margin:1px 0;border:0;background:none;border-radius:var(--r-s);
  cursor:pointer;font-size:13px;color:var(--ink);text-align:left;
  transition:background .14s,color .14s;position:relative;
}
.nav-item .ico{display:flex;color:var(--mut);transition:color .14s;flex:0 0 auto}
.nav-item:hover{background:rgba(127,140,170,.1)}
.nav-item:hover .ico{color:var(--ink)}
.nav-item.active{background:var(--pri-w);color:var(--pri);font-weight:600}
.nav-item.active .ico{color:var(--pri)}
.nav-item .nav-badge{
  margin-left:auto;min-width:16px;height:16px;padding:0 5px;border-radius:999px;
  background:var(--err-bg);color:var(--err-tx);font-size:10px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;
}
.nav-item.nav-hide{display:none}

main{flex:1;min-width:0;padding:22px 30px 90px}
@media (min-width:1760px){main{max-width:1400px}}

/* ═══ Page head ═══ */
.page-head{display:flex;align-items:flex-start;gap:13px;margin:2px 0 20px;flex-wrap:wrap}
.page-head .ico{
  width:38px;height:38px;border-radius:11px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--pri-w);color:var(--pri);
}
.page-head h2{font-size:18px;letter-spacing:.01em}
.page-head .page-desc{color:var(--mut);font-size:12.5px;margin-top:2px}
.page-head .page-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#view{animation:fadein .18s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}

/* ═══ Panel（统一卡片） ═══ */
.panel{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;
}
.panel-head{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 18px 0;
}
.panel-head h3{font-size:14.5px}
.panel-sub{color:var(--mut);font-size:12px;margin-top:1px}
.panel-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-body{padding:14px 18px 18px}
.panel-foot{
  padding:10px 18px;border-top:1px solid var(--border);
  color:var(--faint);font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.panel > hr{border:0;border-top:1px solid var(--border);margin:14px 0}
.sub-title{font-size:12.5px;font-weight:650;margin:0 0 10px;display:flex;align-items:center;gap:8px}

/* ═══ Status tiles（概览看板） ═══ */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
@media (max-width:1280px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.tiles{grid-template-columns:1fr}}
.tile{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);padding:14px 16px 12px;
  display:flex;flex-direction:column;gap:3px;min-width:0;
}
.tile-top{display:flex;align-items:center;gap:7px}
.tile-top .tile-ico{margin-left:auto;color:var(--faint);display:flex}
.tile-state{font-size:12.5px;font-weight:650}
.tile-name{font-size:15px;font-weight:650;margin-top:2px}
.tile-sub{color:var(--mut);font-size:12px;min-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-actions{display:flex;gap:6px;margin-top:8px}
.tile-actions .btn{padding:4px 10px;font-size:12px}

/* ═══ Dot / Tag ═══ */
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;display:inline-block}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.dot.off{background:var(--faint)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
.dot.err{background:var(--err);box-shadow:0 0 0 3px var(--err-bg)}
.tag{
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  padding:1px 9px;border-radius:999px;font-size:11px;font-weight:550;vertical-align:1px;
}
.tag.ok{background:var(--ok-bg);color:var(--ok-tx)}
.tag.warn{background:var(--warn-bg);color:var(--warn-tx)}
.tag.err{background:var(--err-bg);color:var(--err-tx)}
.tag.off{background:var(--off-bg);color:var(--off-tx)}
.tag.info{background:var(--pri-w);color:var(--pri)}
.tag.ghost{background:none;border:1px dashed var(--border2);color:var(--mut)}

/* ═══ Buttons ═══ */
.btn{
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  padding:6px 14px;border-radius:var(--r-s);
  border:1px solid var(--border2);background:var(--card);color:var(--ink);
  cursor:pointer;font-size:13px;line-height:1.5;
  transition:background .15s,border-color .15s,color .15s,transform .06s;
}
.btn:hover{border-color:var(--pri);color:var(--pri);background:var(--pri-w)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 1px 6px rgba(51,112,255,.3)}
.btn.primary:hover{background:var(--pri-h);border-color:var(--pri-h);color:#fff}
.btn.danger{color:var(--err)}
.btn.danger:hover{border-color:var(--err);background:var(--err-bg);color:var(--err)}
.btn.danger-solid{background:var(--err);border-color:var(--err);color:#fff}
.btn.danger-solid:hover{background:#d6383d;border-color:#d6383d;color:#fff;filter:brightness(1.05)}
.btn.sm{padding:3px 10px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:none;color:var(--mut)}
.btn.ghost:hover{color:var(--pri);background:var(--pri-w);border-color:transparent}
.btn .spin{
  width:13px;height:13px;border-radius:50%;flex:0 0 auto;
  border:2px solid var(--border2);border-top-color:var(--pri);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<style>
/* ═══ Forms ═══ */
label.fld{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}
label.fld:first-child{margin-top:0}
input[type=text],input[type=password],input[type=number],input[type=search],select,textarea{
  width:100%;padding:7px 11px;
  border:1px solid var(--border2);border-radius:var(--r-s);
  font:inherit;font-size:13px;background:var(--field);color:var(--ink);
  transition:border-color .15s,box-shadow .15s;
}
input:hover,select:hover,textarea:hover{border-color:var(--faint)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-ring)}
textarea{font-family:var(--mono);font-size:12.5px;min-height:90px;line-height:1.6;resize:vertical}
select{cursor:pointer}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 16px}
@media (max-width:1100px){.grid3{grid-template-columns:1fr}}
.frow{display:flex;gap:12px;align-items:flex-start}
.frow>*{flex:1;min-width:0}
.frow .btn,.frow .btn-wrap{flex:0 0 auto;align-self:flex-end}
.input-btn{display:flex;gap:8px}
.input-btn>input{flex:1;min-width:0}
.input-btn>.btn{flex:0 0 auto;align-self:center}

/* ═══ Radio cards ═══ */
.rcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0}
.rcard{
  border:1px solid var(--border2);border-radius:10px;padding:12px 14px;cursor:pointer;
  display:flex;gap:10px;align-items:flex-start;background:var(--field);
  transition:border-color .15s,background .15s;
}
.rcard:hover{border-color:var(--pri)}
.rcard input{margin-top:3px;accent-color:var(--pri)}
.rcard.on{border-color:var(--pri);background:var(--pri-w)}
.rcard b{font-size:13px;display:block}
.rcard .hint{margin-top:2px}

/* ═══ Switch ═══ */
.switch-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.switch{position:relative;display:inline-flex;flex:0 0 auto;width:40px;height:23px;margin:0;cursor:pointer}
.switch input{position:absolute;width:0;height:0;opacity:0}
.switch .track{position:absolute;inset:0;border-radius:999px;background:var(--border2);transition:background .16s}
.switch .track::after{
  content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
  background:#fff;box-shadow:var(--shadow);transition:transform .16s;
}
.switch input:checked+.track{background:var(--pri)}
.switch input:checked+.track::after{transform:translateX(17px)}
.switch input:focus-visible+.track{box-shadow:0 0 0 3px var(--pri-ring)}
.switch-label{font-size:13px}

/* ═══ Tables ═══ */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
thead th{color:var(--mut);font-weight:550;font-size:11.5px;letter-spacing:.04em;border-bottom:1px solid var(--border2)}
tbody tr{transition:background .12s}
tbody tr:hover{background:rgba(127,140,170,.05)}
tbody tr:last-child td{border-bottom:0}
tr.empty td{text-align:center;padding:26px 10px;color:var(--mut)}
td.ops{white-space:nowrap}
tr.rowlink{cursor:pointer}
.kv td:first-child{width:150px;color:var(--mut);font-size:12.5px}

/* ═══ Chips（可编辑名单） ═══ */
.echips{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:9px 11px;min-height:40px}
.echips.on-box{border:1px solid var(--border2);border-radius:var(--r-s);background:var(--field)}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card);border:1px solid var(--border);
  padding:2px 6px 2px 11px;border-radius:999px;
  font-size:12px;font-family:var(--mono);color:var(--ink);white-space:nowrap;
}
.chip .x{
  border:0;background:none;color:var(--faint);cursor:pointer;
  font-size:13px;line-height:1;padding:1px 4px;border-radius:50%;
}
.chip .x:hover{color:var(--err);background:var(--err-bg)}
.chip.src{font-family:inherit;background:var(--off-bg);border-color:transparent;color:var(--mut)}

/* ═══ Tabs ═══ */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tabs button{
  padding:8px 16px;border:0;background:none;cursor:pointer;font:inherit;font-size:13.5px;
  color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color .15s,border-color .15s;
}
.tabs button:hover{color:var(--ink)}
.tabs button.active{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.tabs .dot{margin-left:5px;vertical-align:1px}
.subtabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.subtabs button{
  padding:5px 14px;border-radius:999px;border:1px solid var(--border2);
  background:none;cursor:pointer;font:inherit;font-size:12.5px;color:var(--ink);
  transition:all .15s;
}
.subtabs button:hover{border-color:var(--pri);color:var(--pri)}
.subtabs button.active{background:var(--pri-w);color:var(--pri);border-color:var(--pri);font-weight:600}

/* ═══ Drawer ═══ */
.mask{position:fixed;inset:0;background:rgba(13,17,26,.42);z-index:50;display:flex;justify-content:flex-end;animation:fadein .16s ease}
.mask.center{justify-content:center;align-items:center}
.mask[hidden]{display:none}
.drawer{
  position:relative; /* 左缘拖拽手柄的定位基准 */
  width:min(960px,94vw);height:100%;background:var(--card);
  border-left:1px solid var(--border);display:flex;flex-direction:column;
  box-shadow:-12px 0 40px rgba(13,17,26,.2);
  animation:slidein .22s cubic-bezier(.22,.8,.36,1);
}
.drawer.narrow{width:min(560px,94vw)}
@keyframes slidein{from{transform:translateX(40px);opacity:.4}}
/* 左边缘拖拽调宽手柄（与实际配置页 assets/web 同款交互）：8px 命中区，视觉条 2px、悬停/拖拽显主题色 */
.drawer-resize{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:2;touch-action:none}
.drawer-resize::after{content:'';position:absolute;left:3px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s}
.drawer-resize:hover::after,.drawer-resize.dragging::after{background:var(--pri)}
body.drawer-resizing{cursor:ew-resize;user-select:none}
.drawer>header{
  display:flex;align-items:center;gap:12px;padding:0 20px;height:52px;
  border-bottom:1px solid var(--border);flex:0 0 auto;
}
.drawer>header h3{font-size:14.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-body{flex:1;overflow-y:auto;padding:18px 22px}
.drawer-foot{
  padding:12px 20px;border-top:1px solid var(--border);
  display:flex;gap:10px;align-items:center;flex:0 0 auto;
}
.drawer-foot .sp{flex:1}
/* 抽屉内子模块导航 */
.dw-layout{display:flex;gap:20px;align-items:flex-start}
.dw-nav{width:150px;flex:0 0 auto;position:sticky;top:0;display:flex;flex-direction:column;gap:2px}
.dw-nav button{
  display:flex;align-items:center;gap:8px;width:100%;padding:7px 11px;
  border:0;background:none;border-radius:var(--r-s);cursor:pointer;
  font:inherit;font-size:12.5px;color:var(--mut);text-align:left;transition:all .14s;
}
.dw-nav button:hover{background:rgba(127,140,170,.09);color:var(--ink)}
.dw-nav button.active{background:var(--pri-w);color:var(--pri);font-weight:600}
.dw-nav button .cnt{margin-left:auto;font-size:11px;color:var(--faint)}
.dw-pane{flex:1;min-width:0}
@media (max-width:760px){.dw-layout{flex-direction:column}.dw-nav{flex-direction:row;flex-wrap:wrap;width:100%;position:static}}

/* ═══ Modal / Dialog ═══ */
.dlg{
  width:min(430px,92vw);background:var(--card);border-radius:14px;padding:20px 22px 16px;
  box-shadow:var(--shadow-2);border:1px solid var(--border);
  animation:pop .16s cubic-bezier(.22,.8,.36,1);
}
@keyframes pop{from{transform:scale(.96);opacity:.5}}
.dlg-title{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dlg-title.danger{color:var(--err)}
.dlg-msg{font-size:13px;line-height:1.75;white-space:pre-line;word-break:break-word;color:var(--ink)}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

/* ═══ Modal（通用居中弹窗：openModal() 用，宽度可配） ═══ */
.modal{
  background:var(--card);border-radius:14px;border:1px solid var(--border);
  box-shadow:var(--shadow-2);width:min(520px,92vw);max-height:88vh;
  display:flex;flex-direction:column;
  animation:pop .16s cubic-bezier(.22,.8,.36,1);
}
.modal-head{
  display:flex;align-items:center;gap:10px;flex:0 0 auto;
  padding:16px 20px 12px;border-bottom:1px solid var(--border);
}
.modal-head h3{font-size:14.5px;flex:1;min-width:0}
.modal-body{padding:16px 20px;overflow-y:auto}
.modal-foot{
  padding:12px 20px 16px;border-top:1px solid var(--border);flex:0 0 auto;
  display:flex;gap:10px;align-items:center;justify-content:flex-end;
}
.modal-foot .sp{flex:1}

/* ═══ Toast ═══ */
#toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-12px);
  background:rgba(28,35,51,.94);color:#fff;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  padding:9px 20px;border-radius:999px;font-size:13px;
  box-shadow:var(--shadow-2);opacity:0;transition:opacity .25s,transform .25s;
  pointer-events:none;max-width:80vw;z-index:100;
}
#toast.show{opacity:.97;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--err)}

/* ═══ Tooltip（信息收納：ⓘ 悬浮显示） ═══ */
.tip{position:relative;display:inline-flex;color:var(--faint);cursor:help;vertical-align:-2px}
.tip:hover{color:var(--pri)}
.tip::after{
  content:attr(data-tip);
  position:absolute;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%) translateY(4px);
  background:rgba(28,35,51,.95);color:#fff;font-size:11.5px;font-weight:400;line-height:1.6;
  padding:7px 11px;border-radius:8px;width:max-content;max-width:280px;white-space:normal;
  opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:60;
  text-align:left;font-family:inherit;
}
.tip:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}

/* ═══ Savebar（统一未保存条） ═══ */
.savebar{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--card);border:1px solid var(--warn);border-radius:999px;
  box-shadow:var(--shadow-2);padding:8px 10px 8px 18px;
  display:flex;align-items:center;gap:12px;z-index:40;
  animation:rise .2s ease;
}
@keyframes rise{from{transform:translate(-50%,10px);opacity:0}}
.savebar .state{font-size:12.5px;color:var(--warn-tx);display:flex;align-items:center;gap:7px}
.savebar[hidden]{display:none}

/* ═══ Banner / Empty / Misc ═══ */
.banner{border-radius:10px;padding:9px 13px;font-size:12.5px;line-height:1.7;display:flex;gap:8px;align-items:flex-start}
.banner.warn{background:var(--warn-bg);color:var(--warn-tx)}
.banner.err{background:var(--err-bg);color:var(--err-tx)}
.banner.info{background:var(--pri-w);color:var(--pri)}
.banner b{font-weight:650}
.empty{text-align:center;padding:30px 16px;color:var(--mut)}
.empty .btn{margin-top:10px}
.mono{font-family:var(--mono);font-size:12px}
.mut{color:var(--mut)}
.dim{color:var(--faint)}
details.adv{border:1px solid var(--border);border-radius:10px;padding:0 14px;background:var(--sunk)}
details.adv>summary{cursor:pointer;font-size:12.5px;color:var(--mut);padding:10px 0;list-style:none;display:flex;align-items:center;gap:6px}
details.adv>summary::before{content:'▸';transition:transform .15s;font-size:10px}
details.adv[open]>summary::before{transform:rotate(90deg)}
details.adv>.adv-body{padding:2px 2px 14px}
.mini-note{font-size:11.5px;color:var(--faint);line-height:1.7}

/* ═══ App 卡片网格 ═══ */
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.acard{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);padding:16px;cursor:pointer;
  transition:border-color .15s,box-shadow .15s;display:flex;flex-direction:column;gap:9px;
}
.acard:hover{border-color:var(--pri);box-shadow:var(--shadow-2)}
.acard-head{display:flex;align-items:center;gap:8px}
.acard-head b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard-head .dot{margin-left:auto}
.acard-meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mut);font-size:12px}
.acard-meta span{display:inline-flex;align-items:center;gap:5px;min-width:0}
.acard-foot{display:flex;gap:6px;margin-top:2px}
.acard.newcard{
  border-style:dashed;border-color:var(--border2);background:none;
  align-items:center;justify-content:center;color:var(--mut);min-height:130px;
  box-shadow:none;gap:6px;
}
.acard.newcard:hover{color:var(--pri);border-color:var(--pri);background:var(--pri-w)}

/* ═══ pickChips（可输入筛选的下拉多选，用于分身白名单） ═══ */
.pick{position:relative}
.pick .pick-pop{
  position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;
  background:var(--card);border:1px solid var(--border2);border-radius:10px;
  box-shadow:var(--shadow-2);max-height:220px;overflow-y:auto;padding:4px;
}
.pick .pick-pop[hidden]{display:none}
.pick .pick-opt{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  border:0;background:none;cursor:pointer;font:inherit;font-size:12.5px;color:var(--ink);
  padding:6px 9px;border-radius:7px;transition:background .12s;
}
.pick .pick-opt:hover{background:var(--pri-w)}
.pick .pick-opt .sub{color:var(--faint);font-size:11px;margin-left:auto;font-family:var(--mono)}
.pick .pick-empty{padding:10px;color:var(--faint);font-size:12px;text-align:center}

/* ═══ 厂商档案卡（加宽版网格） ═══ */
.cardgrid.wide{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
@media (max-width:960px){.cardgrid.wide{grid-template-columns:1fr}}
/* 档案单选小卡（生效配置 Tab） */
.pfcards{display:flex;flex-wrap:wrap;gap:10px}
.pfcard{
  border:1px solid var(--border2);border-radius:10px;padding:10px 14px;cursor:pointer;
  background:var(--field);min-width:180px;transition:border-color .15s,background .15s;
}
.pfcard:hover{border-color:var(--pri)}
.pfcard.on{border-color:var(--pri);background:var(--pri-w);box-shadow:0 0 0 3px var(--pri-ring)}
.pfcard b{font-size:13px;display:flex;align-items:center;gap:7px}
.pfcard .hint{margin-top:3px;font-size:11.5px}

/* ═══ 工作区卡片列表（对齐参考图2） ═══ */
.ws-list{display:flex;flex-direction:column}
.ws-item{
  display:flex;align-items:center;gap:13px;padding:12px 4px;
  border-bottom:1px solid var(--border);
}
.ws-item:last-child{border-bottom:0}
.ws-item .ws-ico{
  width:36px;height:36px;border-radius:10px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--warn-bg);color:var(--warn);
}
.ws-item .ws-main{flex:1;min-width:120px}
.ws-item .ws-name{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.ws-item .ws-path{color:var(--mut);font-size:11.5px;font-family:var(--mono);margin-top:2px;word-break:break-all}
.ws-item .ws-ops{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
/* 选目录弹窗内已选路径卡 */
.picked-path{
  display:flex;align-items:center;gap:11px;border:1px solid var(--border);
  border-radius:10px;padding:11px 14px;background:var(--sunk);
}
.picked-path .ws-ico{width:32px;height:32px;border-radius:9px}
.picked-path b{font-size:13px}
.picked-path .hint{font-size:11.5px;color:var(--mut)}

/* ═══ 会话页（对齐参考图3） ═══ */
.chats-layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1080px){.chats-layout{grid-template-columns:1fr}}
.chat-list-panel{padding:0!important}
.chat-obj{
  display:flex;gap:10px;padding:11px 14px;cursor:pointer;
  border-bottom:1px solid var(--border);transition:background .12s;align-items:flex-start;
}
.chat-obj:last-child{border-bottom:0}
.chat-obj:hover{background:rgba(127,140,170,.06)}
.chat-obj.active{background:var(--pri-w)}
.chat-obj .c-ava{
  width:34px;height:34px;border-radius:9px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--pri-w);color:var(--pri);font-size:12.5px;font-weight:650;
}
.chat-obj .c-main{flex:1;min-width:0}
.chat-obj .c-top{display:flex;align-items:center;gap:6px}
.chat-obj .c-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-obj .c-time{margin-left:auto;color:var(--faint);font-size:11px;flex:0 0 auto}
.chat-obj .c-prev{color:var(--mut);font-size:11.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-obj .c-topic{font-size:12px;font-weight:600;color:var(--ink);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-obj .c-badges{display:flex;gap:5px;margin-top:4px;align-items:center}
.cmsg-day{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:11.5px;margin:16px 0 10px}
.cmsg-day::before,.cmsg-day::after{content:'';flex:1;border-top:1px solid var(--border)}
.cmsg{display:flex;margin:8px 0;gap:9px}
.cmsg .m-ava{
  width:28px;height:28px;border-radius:8px;flex:0 0 auto;margin-top:2px;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--off-bg);color:var(--mut);font-size:11px;font-weight:650;
}
.cmsg .m-body{max-width:min(76%,640px)}
.cmsg .m-meta{font-size:11px;color:var(--faint);margin-bottom:3px;display:flex;gap:8px;align-items:center}
.cmsg .m-bubble{
  background:var(--card);border:1px solid var(--border);border-radius:11px;
  padding:8px 13px;font-size:13px;line-height:1.7;word-break:break-word;
}
.cmsg.me{flex-direction:row-reverse}
.cmsg.me .m-body{display:flex;flex-direction:column;align-items:flex-end}
.cmsg.me .m-bubble{background:var(--pri-w);border-color:transparent}
.cmsg .m-link{font-size:11.5px;margin-top:4px}
.cmsg .m-full{margin-top:6px;font-size:12.5px;color:var(--mut);background:var(--sunk);border:1px dashed var(--border2);border-radius:9px;padding:9px 12px;line-height:1.7;white-space:pre-wrap}
.cmsg .m-full[hidden]{display:none}
.csum{
  border:1px solid var(--border);border-radius:11px;background:var(--card);
  padding:11px 14px;margin:10px 0 10px 37px;max-width:min(76%,640px);
}
.csum-top{display:flex;align-items:center;gap:8px}
.csum-top b{font-size:13px}
.csum-top .tag{margin-left:auto}
.csum-stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:12px;color:var(--mut)}
.csum-stats b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ═══ 设置 / 密码锁屏 ═══ */
.lockmask{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:rgba(13,17,26,.55);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
  animation:fadein .18s ease;
}
.lockmask[hidden]{display:none}
.lockcard{
  width:min(360px,92vw);background:var(--card);border:1px solid var(--border);
  border-radius:18px;box-shadow:var(--shadow-2);padding:30px 28px 24px;text-align:center;
  animation:pop .18s cubic-bezier(.22,.8,.36,1);
}
.lockcard .lock-logo{
  width:46px;height:46px;border-radius:13px;margin:0 auto 14px;
  display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#3370ff,#7c5bff 130%);color:#fff;
  box-shadow:0 4px 14px rgba(51,112,255,.35);
}
.lockcard h3{font-size:16px}
.lockcard .lock-sub{color:var(--mut);font-size:12.5px;margin:5px 0 18px}
.lockcard input{margin-bottom:10px;text-align:center;letter-spacing:.2em}
.lock-err{color:var(--err-tx);font-size:12px;min-height:18px;margin-bottom:6px}
.lock-tip{color:var(--faint);font-size:11px;margin-top:12px;line-height:1.7}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .28s ease}

/* ═══ User row（记忆用户） ═══ */
.urow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.urow:last-child{border-bottom:0}
.urow .u-ava{
  width:32px;height:32px;border-radius:9px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--pri-w);color:var(--pri);font-size:13px;font-weight:650;
}
.urow .u-main{flex:1;min-width:180px}
.urow .u-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.urow .u-sub{color:var(--mut);font-size:11.5px;margin-top:1px}
.urow .u-ops{display:flex;gap:6px;flex-wrap:wrap}

/* ═══ Responsive ═══ */
@media (max-width:900px){
  .layout{flex-direction:column}
  .sidenav{
    width:auto;max-height:none;position:sticky;top:54px;z-index:20;
    display:flex;gap:4px;overflow-x:auto;padding:8px 12px;
    background:var(--header-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  .nav-search{display:none}
  .nav-group{display:contents}
  .nav-group-label{display:none}
  .nav-item{width:auto;flex:0 0 auto;padding:6px 12px}
  main{padding:16px 16px 90px}
  .page-head .page-actions{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

<body>
<header class="topbar">

</div>

    <header><h3 id="drawerTitle"></h3><button class="btn ghost" id="drawerClose" aria-label="关闭">✕</button></header>

    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
<div class="mask center" id="dlgMask" hidden>
  <div class="dlg" role="alertdialog" aria-modal="true">
    <div class="dlg-title" id="dlgTitle"></div>
    <div class="dlg-msg" id="dlgMsg"></div>
    <div class="dlg-foot">
      <button class="btn" id="dlgCancel">取消</button>
      <button class="btn primary" id="dlgOk">确定</button>
    </div>
  </div>
</div>
<div class="lockmask" id="lockMask" hidden>
  <div class="lockcard">
    <span class="lock-logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>

  </div>
</div>
<div id="toast" role="status"></div>
<div class="savebar" id="savebar" hidden>

  <button class="btn sm primary" id="sbSave">保存</button>
</div>

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = (ms) => new Promise(r=>setTimeout(r, ms));

function toast(msg, isErr){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(t._h);
  t._h = setTimeout(()=>{ t.className=''; }, isErr ? 4200 : 2600);
}
/* 原型内统一假保存 */
const fakeSave = (what='已保存') => new Promise(res=>setTimeout(()=>{ toast('✅ ' + what + '（原型演示）'); res(true); }, 350));

let dlgResolve = null;
function confirmDlg({title, msg, danger=false, okText='确定'}){
  $('#dlgTitle').innerHTML = (danger ? I(IC.warn,16) + ' ' : '') + title;
  $('#dlgTitle').className = 'dlg-title' + (danger ? ' danger' : '');
  $('#dlgMsg').innerHTML = msg;
  const ok = $('#dlgOk');
  ok.textContent = okText;
  ok.className = 'btn ' + (danger ? 'danger-solid' : 'primary');
  $('#dlgMask').hidden = false;
  const res = (v) => { $('#dlgMask').hidden = true; const r = dlgResolve; dlgResolve=null; r && r(v); };
  ok.onclick = () => res(true);
  $('#dlgCancel').onclick = () => res(false);
  $('#dlgMask').onclick = (e) => { if (e.target === $('#dlgMask')) res(false); };
  return new Promise(r => { dlgResolve = r; });
}

/* 抽屉 */
let drawerOnClose = null;
function openDrawer({title, body, foot='', narrow=false, onClose=null}){
  $('#drawerTitle').textContent = title;
  $('#drawerBody').innerHTML = body;
  $('#drawerFoot').innerHTML = foot;
  $('#drawerBox').classList.toggle('narrow', narrow);
  $('#drawerMask').hidden = false;
  drawerOnClose = onClose;
  return $('#drawerBody');
}
function closeDrawer(){ $('#drawerMask').hidden = true; const f = drawerOnClose; drawerOnClose=null; f && f(); }
$('#drawerClose').onclick = closeDrawer;
$('#drawerMask').onclick = (e) => { if (e.target === $('#drawerMask')) closeDrawer(); };

/* ═══ 抽屉宽度拖拽（与实际配置页同款：localStorage 记忆 · 双击手柄恢复默认） ═══ */
const PROTO_DRAWER_WIDTH_KEY = 'lcb-proto-drawer-width';
const DRAWER_MIN_WIDTH = 420;
const clampDrawerWidth = (px, vw) => Math.max(DRAWER_MIN_WIDTH, Math.min(Math.round(px), Math.floor(vw*0.94)));
const drawerEl = () => $('#drawerBox');
const applyDrawerWidth = (px) => { drawerEl().style.width = `min(${px}px, 94vw)`; };
(function initDrawerResize(){
  let saved = NaN; try{ saved = Number(localStorage.getItem(PROTO_DRAWER_WIDTH_KEY)); }catch{}
  if (Number.isFinite(saved) && saved >= DRAWER_MIN_WIDTH) applyDrawerWidth(saved);
  const handle = $('#drawerResize');
  handle.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    handle.classList.add('dragging');
    document.body.classList.add('drawer-resizing');
    const startWidth = drawerEl().getBoundingClientRect().width;
    const startX = e.clientX;
    const move = (ev)=> applyDrawerWidth(clampDrawerWidth(startWidth + (startX - ev.clientX), window.innerWidth));
    const up = ()=>{
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', up);
      handle.classList.remove('dragging');
      document.body.classList.remove('drawer-resizing');
      const w = clampDrawerWidth(drawerEl().getBoundingClientRect().width, window.innerWidth);
      try{ localStorage.setItem(PROTO_DRAWER_WIDTH_KEY, String(w)); }catch{}
    };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
  });
  handle.addEventListener('dblclick', ()=>{
    try{ localStorage.removeItem(PROTO_DRAWER_WIDTH_KEY); }catch{}
    drawerEl().style.width = '';
  });
})();

/* ═══ pickChips：可输入筛选的下拉多选（候选项来自已有数据，不再纯手打） ═══ */
function pickChips(mount, values, {options=[], placeholder='输入筛选，点选添加', onChange=null, subOf=null}={}){
  mount.classList.add('pick');
  const norm = (v)=> String(v||'').trim();
  const render = ()=>{
    mount.innerHTML = `
      <div class="echips on-box" style="position:relative">
        ${values.map((v,i)=>`<span class="chip">${esc(v)}<button class="x" data-i="${i}" aria-label="移除">×</button></span>`).join('')}
        <input type="text" style="flex:1;min-width:110px;border:0;background:none;box-shadow:none;padding:4px 2px;font-size:12.5px" placeholder="${esc(placeholder)}">
      </div>
      <div class="pick-pop" hidden></div>`;
    const pop = $('.pick-pop', mount), inp = $('input', mount);
    const closePop = ()=> pop.hidden = true;
    const showPop = ()=>{
      const q = norm(inp.value).toLowerCase();
      const rest = options.filter(o=>!values.includes(o));
      const hits = rest.filter(o=>o.toLowerCase().includes(q));
      pop.innerHTML = hits.length
        ? hits.map(o=>`<button type="button" class="pick-opt">${esc(o)}${subOf?`<span class="sub">${esc(subOf(o))}</span>`:''}</button>`).join('')
        : '<div class="pick-empty">无匹配项</div>';
      pop.hidden = false;
      $$('.pick-opt', pop).forEach(b=> b.onclick = ()=>{
        values.push(b.firstChild.textContent);
        inp.value=''; closePop(); render(); onChange && onChange([...values]);
      });
    };
    inp.onfocus = showPop;
    inp.oninput = showPop;
    inp.onkeydown = (e)=>{
      if (e.key==='Enter'){ e.preventDefault();
        const first = $('.pick-opt', pop);
        const q = norm(inp.value);
        if (first) first.click();
        else if (q && !options.includes(q)) { values.push(q); inp.value=''; closePop(); render(); onChange && onChange([...values]); toast(`「${q}」不在候选中，已按自定义值添加`); }
      }
      if (e.key==='Escape' && !pop.hidden){ e.stopPropagation(); closePop(); }
    };
    inp.onblur = ()=> setTimeout(closePop, 160);
    $$('.x', mount).forEach(b=> b.onclick = ()=>{ values.splice(+b.dataset.i,1); render(); onChange && onChange([...values]); });
  };
  render();
  return { render };
}

/* 可编辑 chips 名单 */
function echips(mount, values, {placeholder='输入后回车添加', onChange=null}={}){
  const render = () => {
    mount.innerHTML = values.map((v,i)=>`<span class="chip">${esc(v)}<button class="x" data-i="${i}" aria-label="移除">×</button></span>`).join('')
      + `<input type="text" style="flex:1;min-width:120px;border:0;background:none;box-shadow:none;padding:4px 2px;font-size:12.5px" placeholder="${esc(placeholder)}">`;
    $$('.x', mount).forEach(b => b.onclick = ()=>{ values.splice(+b.dataset.i,1); render(); onChange && onChange([...values]); });
    const inp = $('input', mount);
    inp.onkeydown = (e)=>{ if(e.key==='Enter' && inp.value.trim()){ e.preventDefault(); values.push(inp.value.trim()); inp.value=''; render(); onChange && onChange([...values]); } };
  };
  render();
  return { render };
}

  const inp = $('#navQ');

}

            ${l.latest!==l.version?`<button class="btn sm primary" data-a="update-cli">更新到 v${l.latest}</button>`:''}
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <header class="panel-head"><h3>机器人</h3>
        <div class="panel-actions"><button class="btn sm" data-go="apps">全部应用 →</button></div>
      </header>
      <div class="panel-body" style="padding-top:4px">
        ${DB.apps.map(a=>`<div class="urow">
          <span class="u-ava">${esc((a.name||'?')[0])}</span>
          <div class="u-main"><div class="u-name">${esc(a.name||a.appId)} ${a.role==='deputy'?'<span class="tag off">分身</span>':''}</div>
          <div class="u-sub mono">${esc(a.appId)} · ${a.domain} · ${a.ws||'全局默认工作区'}</div></div>
          <span class="tag ${a.status==='running'?'ok':'err'}">${a.status==='running'?'运行中':'启动失败'}</span>
        </div>`).join('')}
      </div>
    </div>

    <div class="panel">
      <header class="panel-head"><h3>飞书快捷指令</h3>
        <div class="panel-actions"><button class="btn sm" data-go="slash">管理命令 →</button></div>
      </header>
      <div class="panel-body" style="padding-top:8px">
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${DB.slash.map(s=>`<span class="chip" style="font-size:12.5px;padding:4px 12px">/${esc(s.cmd)}<span class="mut" style="font-family:inherit;margin-left:4px">${esc(s.desc)}</span></span>`).join('')}
        </div>
        <div class="mini-note" style="margin-top:10px">在飞书聊天框输入 / 触发；其它 / 开头的消息原文透传给 Claude Code。</div>
      </div>
    </div>`;
    $('#pageActions').innerHTML = `<button class="btn primary" data-a="openlog">${I(IC.file,14)} 查看日志</button>`;
    // 页头按钮在 #view 之外，需单独绑定（原先绑在 #view 委托上，导致「查看日志」点了没反应）
    $('#pageActions [data-a="openlog"]').onclick = ()=> logViewer();
    // 快捷操作（重启入口只保留在「桥接器进程」瓦片，页头不再重复）
    el.addEventListener('click', async (e)=>{
      const a = e.target.closest('[data-a]'); if(!a) return;
      const op = a.dataset.a;
      if (op==='restart'){ a.disabled=true; a.innerHTML='<span class="spin"></span>重启中'; await sleep(1200); toast('✅ 桥接器已重启'); render(); }
      if (op==='stop'){ if (await confirmDlg({title:'停止桥接器', msg:'停止后机器人将不再响应消息。配置页也会随进程关闭，可运行 lcb ui 重开。', danger:true, okText:'停止'})){ toast('已发送停止信号'); render(); } }
      if (op==='start'){ toast('已在后台启动'); render(); }
      if (op==='update'){ a.disabled=true; a.textContent='更新中…'; await sleep(1500); toast('✅ LCB 桥接器已更新到 v'+b.latest+' 并重启'); render(); }
      if (op==='update-cli'){ a.disabled=true; a.textContent='更新中…'; await sleep(1500); toast('✅ 飞书 CLI 已更新到 v'+l.latest); render(); }
      if (op==='openlog'){ logViewer(); }
    });
    el.addEventListener('click', (e)=>{ const g=e.target.closest('[data-go]'); if(g) location.hash=g.dataset.go; });
    $('#ovCheckLcb').onclick = async (e)=>{ const btn=e.currentTarget; btn.disabled=true; btn.innerHTML='<span class="spin"></span>检查中'; await sleep(900); btn.disabled=false; btn.textContent='检查更新'; toast(b.latest!==b.version?'LCB 发现新版本 v'+b.latest:'LCB 已是最新版本'); };
    $('#ovCheckCli').onclick = async (e)=>{ const btn=e.currentTarget; btn.disabled=true; btn.innerHTML='<span class="spin"></span>检查中'; await sleep(900); btn.disabled=false; btn.textContent='检查更新'; toast(l.latest!==l.version?'飞书 CLI 发现新版本 v'+l.latest:'飞书 CLI 已是最新版本'); };
    $('#ovAuto').onchange = async (e)=>{ b.autostart = e.target.checked; if (await fakeSave(e.target.checked?'已注册开机自启':'已关闭开机自启')) render(); };
  },
};

/* ═══════════ 页面：会话（查询条件 + 聊天对象列表 + 消息流，对齐参考图3） ═══════════ */
let chatsBot = '小助手';
let chatsObj = 0;
let chatsQ = '';
PAGES.chats = {
  id:'chats', title:'会话', desc:'按机器人、会话对象与时间范围检索历史对话，查看完整消息与任务执行详情', legend:false,
  render(el){
    const bots = DB.chats.bots;
    if (!bots.includes(chatsBot)) chatsBot = bots[0];
    el.innerHTML = `
    <div class="panel">
      <header class="panel-head"><h3>查询条件</h3>
        <div class="panel-actions"><span class="dim" style="font-size:11.5px">选择机器人和时间范围后，点「查询会话」加载记录</span></div></header>
      <div class="panel-body">
        <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
          <div><label class="fld">飞书机器人 *</label>
            <select id="chBot" style="width:200px">${bots.map(b=>`<option ${b===chatsBot?'selected':''}>${esc(b)}</option>`).join('')}</select></div>
          <div><label class="fld">时间范围</label>
            <select id="chRange" style="width:150px"><option>今天</option><option selected>近 7 天</option><option>近 30 天</option><option value="custom">自定义时间</option></select></div>
          <div id="chDates" style="display:none;gap:8px;align-items:center">
            <input type="date" style="width:150px"><span class="mut">至</span><input type="date" style="width:150px">
          </div>
          <button class="btn primary" id="chGo">${I(IC.search,13)} 查询会话</button>
        </div>
        <div class="mini-note" style="margin-top:8px">默认查询最近 7 天的记录；结果按时间倒序，同一聊天对象的每次对话各为一条会话。</div>
      </div>
    </div>
    <div class="chats-layout">
      <div class="panel" style="margin:0">
        <header class="panel-head"><h3>会话列表</h3>
          <div class="panel-actions"><span class="tag off" id="chCnt"></span></div></header>
        <div style="padding:10px 12px 8px"><input type="search" id="chQ" placeholder="搜索对象、会话主题或消息…" value="${esc(chatsQ)}"></div>
        <div class="chat-list-panel" id="chList" style="border-top:1px solid var(--border)"></div>
      </div>
      <div class="panel" style="margin:0;min-height:440px" id="chDetail"></div>
    </div>`;
    const sessions = ()=> DB.chats.sessions[chatsBot]||[];
    const drawList = ()=>{
      const q = chatsQ.trim().toLowerCase();
      const list = sessions().filter(s=> !q || (s.name+' '+(s.topic||'')+' '+(s.prev||'')).toLowerCase().includes(q));
      $('#chCnt').textContent = `${list.length} 条会话`;
      $('#chList').innerHTML = list.length ? list.map((s)=>{
        const gi = sessions().indexOf(s);
        return `
        <div class="chat-obj ${gi===chatsObj?'active':''}" data-chsi="${gi}" role="button" tabindex="0">
          <span class="c-ava">${s.group?I(IC.chats,15):esc((s.name||'?')[0])}</span>
          <div class="c-main">
            <div class="c-top"><span class="c-name">${esc(s.name)}</span><span class="c-time">${esc(s.time)}</span></div>
            ${s.topic?`<div class="c-topic">${esc(s.topic)}</div>`:''}
            <div class="c-prev">${esc(s.prev||'')}</div>
            <div class="c-badges">${s.group?'<span class="tag info">群聊</span>':'<span class="tag off">私聊</span>'}
              ${s.unread?`<span class="nav-badge" style="position:static">${s.unread}</span>`:''}</div>
          </div>
        </div>`;
      }).join('') : '<div class="empty">无匹配的会话</div>';
      $$('[data-chsi]').forEach(c=> c.onclick = ()=>{ chatsObj = +c.dataset.chsi; drawList(); drawDetail(); });
    };
    const csumHtml = (s)=>`<div class="csum">
      <div class="csum-top"><b>任务执行摘要</b><span class="tag ${s.done?'ok':'warn'}">${s.done?'已完成':'进行中'}</span></div>
      <div class="csum-stats">
        <span>工具调用 <b>${s.tools}</b> 次</span>
        <span>对话轮次 <b>${s.rounds}</b> 轮</span>
        <span>产出文件 <b>${s.files}</b> 个</span>
        <span>执行耗时 <b>${s.dur}</b></span>
      </div></div>`;
    const msgHtml = (m)=>{
      if (m.day) return `<div class="cmsg-day">${esc(m.day)}</div>`;
      const me = m.who==='me';
      const ava = `<span class="m-ava">${esc((m.name||'?')[0])}</span>`;
      return `<div class="cmsg ${me?'me':''}">
        ${me?'':ava}
        <div class="m-body">
          <div class="m-meta" ${me?'style="justify-content:flex-end"':''}>${esc(m.name||'')} <span>${esc(m.time)}</span></div>
          <div class="m-bubble">${esc(m.text)}</div>
          ${m.more?`<button class="btn sm ghost m-link" data-more>查看完整内容</button><div class="m-full" hidden>${esc(m.more)}</div>`:''}
          ${m.summary?csumHtml(m.summary):''}
        </div>
        ${me?ava:''}
      </div>`;
    };
    const drawDetail = ()=>{
      const s = sessions()[chatsObj];
      const d = $('#chDetail');
      if (!s){ d.innerHTML = '<div class="empty" style="margin-top:80px">选择左侧聊天对象查看会话详情</div>'; return; }
      d.innerHTML = `
      <header class="panel-head" style="padding-bottom:12px;border-bottom:1px solid var(--border)">
        <h3>${esc(s.name)} ${s.group?'<span class="tag info">群聊</span>':'<span class="tag off">私聊</span>'}</h3>
        <span class="panel-sub">${esc(chatsBot)}${s.topic?` · ${esc(s.topic)}`:''} · 最近活跃 ${esc(s.time)} · 会话 ID <code>${esc(s.id)}</code></span>
        <div class="panel-actions">
          ${s.group?`<button class="btn sm" id="chAll">${I(IC.chats,13)} 群聊记录</button>`:''}
          <button class="btn sm" id="chCopyId">${I(IC.copy,13)} 复制会话 ID</button>
        </div></header>
      <div class="panel-body" style="padding-top:6px">
        ${s.msgs.map(msgHtml).join('')}
      </div>`;
      $$('[data-more]', d).forEach(b=> b.onclick = ()=>{
        const f = b.nextElementSibling;
        f.hidden = !f.hidden;
        b.textContent = f.hidden ? '查看完整内容' : '收起完整内容';
      });
      const all = $('#chAll'); if (all) all.onclick = ()=> toast('原型：跳转该群全部会话列表');
      $('#chCopyId').onclick = ()=> toast(`会话 ID ${s.id} 已复制`);
    };
    $('#chBot').onchange = (e)=>{ chatsBot = e.target.value; chatsObj = 0; drawList(); drawDetail(); };
    $('#chRange').onchange = (e)=>{ $('#chDates').style.display = e.target.value==='custom' ? 'flex' : 'none'; };
    $('#chGo').onclick = ()=>{ drawList(); drawDetail(); toast(`已加载「${chatsBot}」的会话记录（原型演示）`); };
    $('#chQ').oninput = (e)=>{ chatsQ = e.target.value; drawList(); };
    drawList();
    drawDetail();
  },
};

      if (DB.apps.length<=1) return toast('至少保留一个应用', true);

      if (await confirmDlg({title:'删除应用', msg:`确认删除应用「${a.name}」？删除将立即保存。`, danger:true, okText:'删除'})){ DB.apps.splice(+b.dataset.del,1); await fakeSave('应用已删除'); render(); }

    $('#addApp').onclick = add;
    $('#addAppTop').onclick = add;

};

/* 应用编辑抽屉：顶部横向 Tab（基本信息/模型/触发词/环境变量）；人格与分身白名单并入基本信息 */
function appDrawer(idx){
  const isNew = idx < 0;
  const app = isNew
    ? { name:'', appId:'', secretSet:'', domain:'feishu', ws:'', cc:'', role:'primary', profile:'', profileModel:'', status:'off', persona:'', triggers:[], env:{}, skills:[], dws:[], plugins:[] }
    : JSON.parse(JSON.stringify(DB.apps[idx]));
  const secs = [
    ['base','基本信息'],['role','机器人角色'],['model','模型'],['trig','触发词'],['env','环境变量'],
  ];
  const cnt = (s)=> s==='trig' ? (app.triggers?.length||'') : s==='env' ? (Object.keys(app.env||{}).length||'') : '';
  let cur = 'base';
  const wsNames = DB.workspaces.map(w=>w.name);
  const profiles = DB.claude.profiles.map(p=>p.name);

  const body = openDrawer({
    title: isNew ? '新增应用' : `应用：${app.name || app.appId}`,
    body: `<div class="tabs" id="dwTabs" style="margin-bottom:18px"></div><div id="dwPane"></div>`,
    foot: `${isNew?'':'<button class="btn danger" id="dwDel">删除应用</button>'}<span class="sp"></span><button class="btn" id="dwCancel">取消</button><button class="btn primary" id="dwSave">保存</button>`,
  });

  const paneBase = () => {
    return `
    <div class="sub-title" style="margin-bottom:2px">应用身份
      ${(app.appId&&!isNew)?'<span class="tag ok" style="margin-left:auto">已连接</span>':'<span class="tag off" style="margin-left:auto">未连接</span>'}
    </div>
    <div class="mut" style="font-size:12px;margin-bottom:8px">配置机器人连接信息与默认行为。</div>
    <div class="grid2">
      <div><label class="fld">应用名称 <span class="tip" data-tip="概览页与飞书 /status 显示用，缺省取 App ID">${I(IC.info,13)}</span></label>
        <input type="text" data-f="name" value="${esc(app.name)}" placeholder="素材收集"></div>
      <div><label class="fld">App ID</label><input type="text" data-f="appId" value="${esc(app.appId)}" placeholder="cli_…"></div>

    <div class="input-btn">
      <input type="password" data-f="secret" placeholder="${app.secretSet?'••••••••（留空保持不变）':'未设置'}">
      <button class="btn" type="button" id="dwSecretShow">显示</button>
    </div>
    <div class="mini-note" style="margin-top:5px">密钥已保存。保存时留空或不修改，将继续使用现有密钥。</div>
    <div class="grid3" style="margin-top:6px">

      <div><label class="fld">默认工作区</label><select data-f="ws">
        <option value="">（全局默认）</option>

      <div><label class="fld">并发上限 <span class="tag warn">需重启</span></label>
        <input type="number" min="1" max="100" data-f="cc" value="${esc(app.cc)}" placeholder="缺省用全局"></div>

    <label class="fld">人格补充 <span class="tag off">可选</span> <span class="tag warn">需重启</span> <span class="tip" data-tip="追加到该机器人每个会话的 system prompt，用于多机器人差异化定位">${I(IC.info,13)}</span></label>

  };

      <label class="rcard ${deputy?'on':''}"><input type="radio" name="dwRole" value="deputy" ${deputy?'checked':''}><span><b>分身机器人</b><span class="hint">限定能力，供他人在群里艾特使用</span></span></label>

  const paneTrig = () => `

    <div class="mini-note" style="margin-bottom:8px">注入该机器人的 Claude 子进程，覆盖本机同名值。<span class="tag warn" style="margin-left:4px">需重启</span></div>
    <table><thead><tr><th style="width:36%">KEY</th><th>VALUE</th><th style="width:90px"></th></tr></thead>
    <tbody id="envBody"></tbody></table>
    <button class="btn sm" id="envAdd" style="margin-top:8px">＋ 添加变量</button>`;

  const panes = { base:paneBase, role:paneRole, model:paneModel, trig:paneTrig, env:paneEnv };

  const paintTabs = ()=>{
    $('#dwTabs').innerHTML = secs.map(([id,label])=>
      `<button data-s="${id}" class="${id===cur?'active':''}">${label}${cnt(id)!==''?`<span class="tag off" style="margin-left:4px">${cnt(id)}</span>`:''}</button>`).join('');
    $$('#dwTabs button').forEach(b=> b.onclick = ()=>{ cur=b.dataset.s; paint(); });
  };
  const paint = ()=>{
    paintTabs();
    $('#dwPane').innerHTML = panes[cur]();
    bindPane();
  };

  const bindPane = ()=>{
    const p = $('#dwPane');
    if (cur==='base'){
      $$('[data-f]', p).forEach(inp=> inp.oninput = ()=>{
        const f = inp.dataset.f;
        if (f==='secret'){ if (inp.value.trim()) app.secretSet = inp.value.slice(-2) ? '···'+inp.value.slice(-2) : '···'; }
        else if (f==='cc'){ app.cc = inp.value ? +inp.value : ''; }
        else app[f] = inp.value;
      });
      const showBtn = $('#dwSecretShow');
      if (showBtn) showBtn.onclick = ()=>{
        const sec = $('[data-f=secret]', p);
        const hide = sec.type === 'password';
        sec.type = hide ? 'text' : 'password';
        showBtn.textContent = hide ? '隐藏' : '显示';
      };
    }
    if (cur==='role'){
      $$('.rcard', p).forEach(r=> r.onclick = (e)=>{ e.preventDefault(); app.role = $('input',r).value; paint(); });
      if (app.role==='deputy'){
        pickChips($('#msSkills'), app.skills||(app.skills=[]), {options:DB.skills.map(s=>s.name), placeholder:'输入筛选技能，点选添加', subOf:(n)=>{ const s=DB.skills.find(x=>x.name===n); return s?SK_SOURCE(s):''; }, onChange:v=>app.skills=v});
        pickChips($('#msWs'), app.dws||(app.dws=[]), {options:DB.workspaces.map(w=>w.name), placeholder:'输入筛选工作区，点选添加', subOf:(n)=>{ const w=DB.workspaces.find(x=>x.name===n); return w?w.path:''; }, onChange:v=>app.dws=v});
        pickChips($('#msPlg'), app.plugins||(app.plugins=[]), {options:DB.plugins.map(x=>x.name), placeholder:'输入筛选插件，点选添加', onChange:v=>app.plugins=v});
      }
    }
    if (cur==='model'){
      $('#dwProfile').onchange = (e)=>{ app.profile = e.target.value; app.profileModel=''; paint(); };
      $('#dwModel').onchange = (e)=>{ app.profileModel = e.target.value; };
    }
    if (cur==='trig'){
      const tb = $('#trigBody');
      const draw = ()=>{
        tb.innerHTML = app.triggers.length ? app.triggers.map((t,i)=>`
          <tr><td><input type="text" value="${esc(t.m)}" placeholder="/produce 或 关键词" data-t="${i}" data-c="m"></td>
          <td><input type="text" value="${esc(t.r)}" placeholder="改写后的消息" data-t="${i}" data-c="r"></td>
          <td style="text-align:center"><label class="switch tight"><input type="checkbox" data-t="${i}" data-ask ${t.ask?'checked':''}><span class="track"></span></label></td>
          <td><button class="btn sm danger" data-trm="${i}">删除</button></td></tr>`).join('')
          : '<tr class="empty"><td colspan="4">暂无规则</td></tr>';
        $$('input[data-t]', tb).forEach(inp=> inp.oninput = inp.onchange = ()=>{
          const t = app.triggers[+inp.dataset.t];
          if (inp.dataset.ask) t.ask = inp.checked; else t[inp.dataset.c] = inp.value;
        });
        $$('button[data-trm]', tb).forEach(b=> b.onclick = ()=>{ app.triggers.splice(+b.dataset.trm,1); draw(); paintTabs(); });
      };
      draw();
      $('#trigAdd').onclick = ()=>{ app.triggers.push({m:'',r:'',ask:false}); draw(); paintTabs(); };
    }
    if (cur==='env'){
      const rows = Object.entries(app.env||{});
      const tb = $('#envBody');
      const draw = ()=>{
        tb.innerHTML = rows.length ? rows.map(([k,v],i)=>`
          <tr><td><input type="text" value="${esc(k)}" data-e="${i}" data-c="k"></td>
          <td><input type="text" value="${esc(v)}" data-e="${i}" data-c="v"></td>
          <td><button class="btn sm danger" data-erm="${i}">删除</button></td></tr>`).join('')
          : '<tr class="empty"><td colspan="3">暂无变量</td></tr>';
        $$('input[data-e]', tb).forEach(inp=> inp.oninput = ()=>{
          const r = rows[+inp.dataset.e];
          r[inp.dataset.c==='k'?0:1] = inp.value;
          const obj = {}; rows.forEach(([kk,vv])=>{ if(kk.trim()) obj[kk.trim()]=vv; });
          app.env = obj;
        });
        $$('button[data-erm]', tb).forEach(b=> b.onclick = ()=>{ rows.splice(+b.dataset.erm,1); const obj={}; rows.forEach(([kk,vv])=>obj[kk]=vv); app.env=obj; draw(); paintTabs(); });
      };
      draw();
      $('#envAdd').onclick = ()=>{ rows.push(['','']); draw(); paintTabs(); };
    }
  };

  paint();

  $('#dwCancel').onclick = closeDrawer;
  const delBtn = $('#dwDel');
  if (delBtn) delBtn.onclick = async ()=>{
    if (await confirmDlg({title:'删除应用', msg:`确认删除应用「${app.name||app.appId}」？`, danger:true, okText:'删除'})){ DB.apps.splice(idx,1); await fakeSave('应用已删除'); closeDrawer(); render(); }
  };
  $('#dwSave').onclick = async ()=>{
    if (app.role==='deputy'){
      if (!(app.skills||[]).length) return toast('分身必须配置「允许的技能」', true);
      if (!(app.dws||[]).length) return toast('分身必须配置「允许的工作区」', true);
    }
    if (isNew) DB.apps.push(app); else DB.apps[idx] = app;
    if (await fakeSave('应用配置已保存')){ closeDrawer(); render(); }
  };
}
</script>
<script>
/* ═══════════ 页面：工作区（卡片列表 + 选目录弹窗，对齐参考图2） ═══════════ */
const WS_DEMO_DIRS = ['E:/workspace/e-comm','C:/Users/me/content','D:/projects/2026-new','E:/workspace/experiment'];
function wsFolderModal(idx){
  const isNew = idx < 0;
  const w = isNew ? {name:'',path:''} : JSON.parse(JSON.stringify(DB.workspaces[idx]));
  let dirIdx = 0;
  const paint = ()=>{
    openModal({
      title: isNew?'添加工作区':'修改工作区', width:'min(460px,92vw)',
      body:`
        <div class="mut" style="font-size:12.5px;margin:-4px 0 12px">第一步选择文件夹，接着填写名称。</div>
        ${w.path
          ?`<div class="picked-path"><span class="ws-ico">${I(IC.folderOpen,16)}</span>
              <div><b>${esc(w.path.split(/[\\/]/).pop())}</b><div class="hint mono">${esc(w.path)}</div></div></div>
            <button class="btn sm" id="wsPick" style="margin-top:8px">${I(IC.folder,13)} 重新选择文件夹</button>`
          :`<button class="btn primary" id="wsPick">${I(IC.folder,14)} 选择文件夹</button>`}
        <label class="fld" style="margin-top:16px">工作区名称</label>
        <input type="text" id="wsName" value="${esc(w.name)}" placeholder="如 电商项目">
        <div class="mini-note" style="margin-top:6px">名称用于在工作区列表中识别，可随时修改。</div>
        ${w.path?'':'<div class="mini-note" style="margin-top:10px">如需更换目录，请点击上方按钮重新选择。</div>'}`,
      foot:`<span class="sp"></span><button class="btn" id="wsMCancel">取消</button><button class="btn primary" id="wsMOk">${isNew?'确认添加':'保存'}</button>`,
      closeOnMask:true,
    });
    $('#wsPick').onclick = ()=>{
      w.path = WS_DEMO_DIRS[dirIdx % WS_DEMO_DIRS.length]; dirIdx++;
      if (!w.name) w.name = w.path.split(/[\\/]/).pop();
      paint();
    };
    $('#wsMCancel').onclick = closeModal;
    $('#wsMOk').onclick = async ()=>{
      if (!w.path) return toast('请先选择文件夹', true);
      w.name = $('#wsName').value.trim();
      if (!w.name) return toast('请填写工作区名称', true);
      if (isNew) DB.workspaces.push(w); else DB.workspaces[idx] = w;
      closeModal();
      if (await fakeSave('工作区已保存')) render();
    };
  };
  paint();
}

PAGES.workspaces = {
  id:'workspaces', title:'工作区', desc:'Claude 的工作目录白名单与全局默认',
  render(el){
    el.innerHTML = `
    <div class="panel">
      <header class="panel-head"><h3>工作区目录</h3>
        <span class="panel-sub">选择本机文件夹并设置一个便于识别的名称</span>
        <div class="panel-actions"><button class="btn primary sm" id="wsAdd">＋ 添加工作区</button></div>
      </header>
      <div class="panel-body"><div class="ws-list" id="wsList"></div></div>
      <footer class="panel-foot">${I(IC.info,13)} git 仓库工作区的任务收尾会自动发送汇总 diff 卡片。</footer>
    </div>
    <div class="panel">
      <header class="panel-head"><h3>全局默认</h3>
        <span class="panel-sub">用于新会话的默认行为；默认工作区在上方列表行内「设为默认」</span></header>
      <div class="panel-body">
        <div class="grid2">
          <div><label class="fld">全局并发</label><input type="number" id="defCc" min="1" max="100" value="${DB.defaults.concurrency}"></div>
          <div><label class="fld">上下文提醒阈值 <span class="tip" data-tip="会话上下文超过该 token 数时提醒 /new，0=关闭">${I(IC.info,13)}</span></label>
            <input type="number" id="defCtx" min="0" value="${DB.defaults.ctxRemind}"></div>
          <div><label class="fld">飞书卡片宽度</label><select id="defCard">
            <option value="default" ${DB.defaults.cardWidth==='default'?'selected':''}>默认</option>
            <option value="fill" ${DB.defaults.cardWidth==='fill'?'selected':''}>撑满聊天窗口</option></select></div>
        </div>
      </div>
    </div>`;
    const drawRows = ()=>{
      $('#wsList').innerHTML = DB.workspaces.map((w,i)=>`
        <div class="ws-item">
          <span class="ws-ico">${I(IC.folder,16)}</span>
          <div class="ws-main">
            <div class="ws-name">${esc(w.name)||'<span class="mut">（未命名）</span>'} ${DB.defaults.ws===w.name?'<span class="tag ok">默认</span>':''}</div>
            <div class="ws-path">${esc(w.path)||'（未选择目录）'}</div>
          </div>
          <div class="ws-ops">
            ${DB.defaults.ws===w.name?'':`<button class="btn sm" data-wdef="${i}">设为默认</button>`}
            <button class="btn sm" data-wedit="${i}">修改</button>
            <button class="btn sm danger" data-wdel="${i}">删除</button>
          </div>
        </div>`).join('') || '<div class="empty">暂无工作区，点右上「＋ 添加工作区」开始</div>';
      $$('[data-wdef]').forEach(b=> b.onclick = async ()=>{ DB.defaults.ws = DB.workspaces[+b.dataset.wdef].name; await fakeSave('默认工作区已切换'); render(); });
      $$('[data-wedit]').forEach(b=> b.onclick = ()=> wsFolderModal(+b.dataset.wedit));
      $$('[data-wdel]').forEach(b=> b.onclick = async ()=>{
        if (DB.workspaces.length<=1) return toast('至少保留一个工作区', true);
        const w = DB.workspaces[+b.dataset.wdel];
        if (await confirmDlg({title:'删除工作区', msg:`删除工作区「${w.name}」？点底部保存后生效。`, danger:true, okText:'删除'})){ DB.workspaces.splice(+b.dataset.wdel,1); drawRows(); SaveBar.check(); }
      });
    };
    drawRows();
    SaveBar.init(snapshotDB, render);
    const bindDef = (sel, key, num=false)=>{ const n=$(sel); if(!n) return; const h=()=>{ DB.defaults[key] = num ? (+n.value||0) : n.value; SaveBar.check(); }; n.oninput = h; n.onchange = h; };
    bindDef('#defCc','concurrency',true); bindDef('#defCtx','ctxRemind',true); bindDef('#defCard','cardWidth');
    $('#wsAdd').onclick = ()=> wsFolderModal(-1);
  },
};

/* ═══════════ 页面：Claude 认证（生效配置 = 档案化选择；凭证不再手填） ═══════════ */
let claudeTab = 'cur';
PAGES.claude = {
  id:'claude', title:'Claude 认证', desc:'认证模式、生效凭证与厂商档案；bridge 托管时从档案中选择，无须手填',
  badge: ()=> '',
  render(el){
    const c = DB.claude;
    el.innerHTML = `
    <div class="tabs">
      <button data-t="cur" class="${claudeTab==='cur'?'active':''}">生效配置</button>
      <button data-t="pf" class="${claudeTab==='pf'?'active':''}">厂商档案 <span class="tag off" style="margin-left:4px">${c.profiles.length}</span></button>
    </div><div id="claudePane"></div>`;
    $$('.tabs button', el).forEach(b=> b.onclick = ()=>{ claudeTab=b.dataset.t; render(); });
    const pane = $('#claudePane');
    if (claudeTab==='cur'){
      const cs = DB.claudeStat;
      const ap = c.profiles.find(p=>p.active);
      pane.innerHTML = `
      <div class="panel">
        <header class="panel-head"><h3>当前生效</h3>
          <div class="panel-actions"><span class="tag ${cs.ready?'ok':'err'}">${cs.ready?'已就绪':'未认证'}</span></div></header>
        <div class="panel-body"><table class="kv">
          <tr><td>认证模式</td><td>${c.mode==='managed'?`bridge 托管 · 档案「${esc(ap?ap.name:'未选择')}」`:'继承本机 ~/.claude'}</td></tr>
          <tr><td>BASE_URL</td><td><code>${c.mode==='managed'?(ap?(esc(ap.baseUrl)||'api.anthropic.com（官方默认）'):'—（先选择档案）'):'本机 ~/.claude 配置'}</code></td></tr>
          <tr><td>模型</td><td><code>${esc(c.model||'CLI 默认')}</code></td></tr>
          <tr><td>凭证</td><td><code>${c.mode==='managed'?(ap?.keyHint||'未设置'):'本机登录态'}</code></td></tr>
          <tr><td>settings.json</td><td><code>${esc(cs.settingsPath)}</code></td></tr>
        </table></div>
      </div>
      <div class="panel">
        <header class="panel-head"><h3>认证模式</h3></header>
        <div class="panel-body">
          <div class="rcards">
            <label class="rcard ${c.mode!=='managed'?'on':''}"><input type="radio" name="clMode" value="inherit" ${c.mode!=='managed'?'checked':''}><span><b>继承本机</b><span class="hint">沿用本机 claude login 的登录态</span></span></label>
            <label class="rcard ${c.mode==='managed'?'on':''}"><input type="radio" name="clMode" value="managed" ${c.mode==='managed'?'checked':''}><span><b>bridge 托管</b><span class="hint">凭证来自厂商档案，无需本机登录</span></span></label>
          </div>
          ${c.mode==='managed'?`
          <hr>
          <label class="fld" style="font-size:12.5px;color:var(--ink);font-weight:600">选择厂商档案 <span class="tip" data-tip="凭证类型、BASE_URL 与密钥都在档案中维护；此处只做选择，改档案请到「厂商档案」页签">${I(IC.info,13)}</span></label>
          <div class="pfcards" id="clPfs">
            ${c.profiles.map((p,i)=>`
            <div class="pfcard ${p.active?'on':''}" data-clpf="${i}" role="button" tabindex="0" aria-label="选择档案 ${esc(p.name)}">
              <b>${esc(p.name)} ${p.active?'<span class="tag ok">使用中</span>':''}</b>
              <div class="hint mut">${p.baseUrl?`<span class="mono">${esc(p.baseUrl)}</span>`:'官方默认端点'} · ${esc(p.cred)} · ${esc(p.keyHint||'')}</div>

          </div>
          <div style="display:flex;gap:14px;align-items:flex-end;margin-top:14px;flex-wrap:wrap">
            <div style="flex:1;min-width:240px"><label class="fld">模型 <span class="dim" style="font-weight:400">${esc(ap?ap.name+' 候选':'（先选择档案）')}</span></label>
              <select id="clModel">
                ${ap?ap.models.map(m=>`<option value="${esc(m)}" ${c.model===m?'selected':''}>${esc(m)}${ap.def===m?'（档案默认）':''}</option>`).join(''):'<option value="">（先选择档案）</option>'}
              </select></div>
            <button class="btn" id="clGotoPf">去管理厂商档案 →</button>
          </div>
          <details class="adv" style="margin-top:14px"><summary>高级：环境变量（写入托管 settings.json）</summary>
            <div class="adv-body">
              <table><tbody id="clEnvBody"></tbody></table>
              <button class="btn sm" id="clEnvAdd" style="margin-top:8px">＋ 添加变量</button>

          `:`
          <div class="banner info" style="margin-top:12px">继承本机登录态：LCB 不写托管凭证，Claude CLI 直接使用本机 <code>~/.claude</code> 的登录与配置。如需固定凭证 / 模型，请切到「bridge 托管」并选择厂商档案。</div>`}
          <div style="margin-top:14px"><button class="btn primary" id="clModeSave">保存</button></div>
        </div>
        <footer class="panel-foot">凭证与 BASE_URL 由所选厂商档案统一维护（本页只读展示）；托管模式与本机 ~/.claude 完全隔离；模式切换需重启，模型选择即时生效。</footer>
      </div>`;
      $$('.rcard', pane).forEach(r=> r.onclick = (e)=>{ e.preventDefault(); c.mode = $('input',r).value; render(); });
      $$('[data-clpf]', pane).forEach(card=> card.onclick = ()=>{
        const p = c.profiles[+card.dataset.clpf];
        c.profiles.forEach(x=> x.active = false);
        p.active = true;
        c.model = p.def || p.models[0] || c.model;
        render();
      });
      const msel = $('#clModel');
      if (msel) msel.onchange = (e)=>{ c.model = e.target.value; };
      $('#clGotoPf').onclick = ()=>{ claudeTab='pf'; render(); };
      $('#clModeSave').onclick = ()=> fakeSave('认证配置已保存');
      const rows = Object.entries(c.env||{});

        $('#clEnvBody').innerHTML = rows.map(([k,v],i)=>`<tr><td style="width:38%"><input type="text" value="${esc(k)}" data-ce="${i}" data-c="k"></td><td><div class="input-btn"><input type="text" value="${esc(v)}" data-ce="${i}" data-c="v"><button class="btn sm danger" data-cerm="${i}">删除</button></div></td></tr>`).join('')

        $$('button[data-cerm]').forEach(b=> b.onclick = ()=>{ rows.splice(+b.dataset.cerm,1); drawEnv(); });
      };
      drawEnv();
      $('#clEnvAdd').onclick = ()=>{ rows.push(['','']); drawEnv(); };
    }
    if (claudeTab==='pf'){
      pane.innerHTML = `

        <div class="acard" style="cursor:default">
          <div class="acard-head"><b>${esc(p.name)}</b>${p.active?'<span class="tag ok">使用中</span>':''}</div>
          <div class="acard-meta"><span>${I(IC.key,12)}${esc(p.cred)}</span><span>${I(IC.globe,12)}${p.baseUrl?`<span class="mono">${esc(p.baseUrl)}</span>`:'官方默认'}</span></div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${p.models.map(m=>`<button class="btn sm ${p.active&&m===c.model?'primary':''}" data-usemodel="${i}" data-m="${esc(m)}" title="点击切换为当前模型">${esc(m)}${p.active&&m===c.model?' ✓':''}</button>`).join('')||'<span class="mut">无候选模型</span>'}
          </div>
          <div class="acard-foot">
            <button class="btn sm" data-pfedit="${i}">编辑</button>
            <button class="btn sm danger" data-pfdel="${i}">删除</button>
            <span class="mut" style="font-size:11px;align-self:center;margin-left:auto">默认 ${esc(p.def||'—')}</span>
          </div>
        </div>`).join('')}
        <div class="acard newcard" id="pfAdd">${I(IC.plus,18)}<span>新增档案</span></div>
      </div>`;
      $('#pageActions').innerHTML = '<button class="btn primary" id="pfAddTop">新增档案</button>';
      $$('[data-usemodel]').forEach(b=> b.onclick = async ()=>{
        const p = c.profiles[+b.dataset.usemodel];
        const r = p.models.includes(b.dataset.m);
        c.model = b.dataset.m;
        c.profiles.forEach(x=> x.active = false);
        p.active = r;
        await fakeSave(`已切换模型：${b.dataset.m}`); render();
      });
      $$('[data-pfedit]').forEach(b=> b.onclick = ()=> profileDrawer(+b.dataset.pfedit));
      $$('[data-pfdel]').forEach(b=> b.onclick = async ()=>{
        const p = c.profiles[+b.dataset.pfdel];

const MCP_ENV = {
  github:[{k:'GITHUB_TOKEN', raw:'${GITHUB_TOKEN:-}', missing:true}],
};
const mcpSource = (s)=> s.source==='plugin' ? `插件 · ${esc(s.plugin||'?')}` : s.source==='project' ? '项目级' : s.source==='bridge' ? 'bridge · 可管理' : '用户级 · 本机';
function mcpDrawer(s){
  const editable = s.source==='bridge';
  const cfg = s.type==='stdio' ? { type:'stdio', command:s.conn } : { type:s.type, url:s.conn };
  const envs = MCP_ENV[s.name]||[];
  const renderEnv = ()=> envs.length ? envs.map(e=>`
    <tr><td><code>${esc(e.k)}</code></td><td><code>${esc(e.raw)}</code></td>
    <td>${e.missing?'<span style="color:var(--err-tx)">未设置（展开后为空）</span>':`<code>${esc(e.raw)}</code>`}</td></tr>`).join('')
    : '<tr><td colspan="3" class="mut">（无 env 配置）</td></tr>';
  openDrawer({
    title:`MCP · ${s.name}`,
    body:`<div class="mini-note" style="margin-bottom:8px">来源：${mcpSource(s)}</div>
      ${s.source!=='bridge'&&s.source!=='user'?'<div class="banner warn" style="margin-bottom:10px">只读来源——此 MCP 由插件 / 项目自带，请到对应目录修改。</div>':''}
      ${s.source==='user'?'<div class="banner warn" style="margin-bottom:10px">本机 ~/.claude.json 来源不支持页面编辑（可删除）；如需修改请手动改，或删除后到本页重新添加。</div>':''}
      <label class="fld">配置（JSON${editable?'，可编辑':''}）</label>
      <textarea id="mcJson" rows="8" ${editable?'':'readonly'}>${esc(JSON.stringify(cfg,null,2))}</textarea>
      <label class="fld" style="margin-top:12px">环境变量 <span class="tip" data-tip="当前值已合并：飞书应用 env › Claude 认证 env › settings.json env › 系统环境，支持 \${VAR:-默认值}">${I(IC.info,13)}</span></label>
      <table><thead><tr><th style="width:150px">变量</th><th>配置值</th><th>当前值</th></tr></thead><tbody>${renderEnv()}</tbody></table>`,
    foot:`${editable?'<button class="btn" id="mcEdit">编辑</button><button class="btn primary" id="mcSave" style="display:none">保存</button>':''}<span class="sp"></span><button class="btn" id="mcClose">关闭</button>`,
  });
  $('#mcClose').onclick = closeDrawer;
  if (editable){
    $('#mcEdit').onclick = ()=>{ $('#mcJson').removeAttribute('readonly'); $('#mcEdit').style.display='none'; $('#mcSave').style.display=''; };
    $('#mcSave').onclick = async ()=>{
      try{ JSON.parse($('#mcJson').value); }catch(err){ return toast('JSON 解析失败：'+err.message, true); }
      if (await fakeSave('已保存（任务级热生效，无须重启）')){ closeDrawer(); render(); }
    };
  }
}

      <div class="input-btn" style="max-width:460px"><input type="text" id="memEndpoint" value="${esc(m.endpoint)}"><span class="tip" style="align-self:center" data-tip="一般无须修改：一键安装自动回写；远程模式填外部服务地址">${I(IC.info,14)}</span></div>
      <div id="memTestResult" style="margin-top:12px"></div>
    </div>
    <footer class="panel-foot">${I(IC.info,13)} 保存后可一键「立即生效」——重渲染配置并重启<b>记忆服务</b>，桥接器与进行中任务不受影响。</footer>
  </div>`;
  $('#memOn').onchange = async (e)=>{
    const next = e.target.checked;
    if (next && !(await confirmDlg({title:'启用长期记忆', msg:'开启后每个机器人的每条消息将自动：注入记忆召回（hooks）+ 按命名空间隔离读写。确认开启？', okText:'开启'}))){ e.target.checked=false; return; }
    m.enabled = next; await fakeSave(next?'记忆增强已开启':'记忆增强已关闭'); render();
  };
  $('#memCopy').onclick = ()=> toast('服务地址已复制');
  $('#memFix').onclick = async (e)=>{ const b=e.currentTarget; b.disabled=true; b.innerHTML='<span class="spin"></span>检查中'; await sleep(1100); b.disabled=false; b.textContent='检查修复'; toast('✅ 全部就绪（原型演示）'); };
  $('#memRefresh').onclick = ()=> render();
  if ($('#memStart')) $('#memStart').onclick = async (e)=>{ const b=e.currentTarget; b.disabled=true; b.innerHTML='<span class="spin"></span>启动中'; await sleep(1200); m.state='running'; await fakeSave('服务已启动'); render(); };
  if ($('#memStop')) $('#memStop').onclick = async ()=>{ if (await confirmDlg({title:'停止受管服务', msg:'停止 LCB 托管的 OpenViking 服务？记忆功能将不可用，可随时重新拉起。', danger:true, okText:'停止'})){ m.state='stopped'; await fakeSave('服务已停止'); render(); } };
  $('#memProvider').onchange = (e)=>{
    const p = MEM_PRESETS[e.target.value]; if (!p) return;
    if (!$('#memApiBase').value.trim()) $('#memApiBase').value = p.base;
    if (!$('#memVlm').value.trim()) $('#memVlm').value = p.vlm;
    if (!$('#memEmb').value.trim()) $('#memEmb').value = p.emb;
    $('#memApiKey').placeholder = p.keyHint;
  };
  $('#memTest').onclick = async (e)=>{
    const b = e.currentTarget; b.disabled = true;
    $('#memTestResult').innerHTML = '<span class="mut">测试中（真实调用 embedding + 提炼模型各一次）…</span>';
    await sleep(1000);
    $('#memTestResult').innerHTML = '<span class="tag ok">双绿通过</span> <span class="mut" style="font-size:12px">✅ 向量模型 embedding-3 正常返回 · ✅ 提炼模型 glm-4.7 正常返回</span>';
    b.disabled = false;
  };
  $('#memSaveModel').onclick = async ()=>{
    m.model.provider = $('#memProvider').value;
    m.model.apiBase = $('#memApiBase').value.trim();
    m.model.vlm = $('#memVlm').value.trim();
    m.model.emb = $('#memEmb').value.trim();
    m.model.embBase = $('#memEmbBase').value.trim();
    if (await fakeSave('模型配置已保存')){
      if (await confirmDlg({title:'使新配置立即生效', msg:'模型配置已保存。<br><br>记忆服务需<b>重渲染配置并重启</b>才能应用新模型。<br>立即生效？', okText:'立即生效'})) toast('✅ 已应用（重渲染 → 重启服务 → 校验插件）');
      else toast('已保存。稍后可点「检查修复」应用');
    }
  };
}

      <div style="display:flex;justify-content:center;padding:8px 0 2px">

          repeating-linear-gradient(0deg,var(--ink) 0 6px,transparent 6px 12px),
