<script>

/* ═══════════ 页面：插件 ═══════════ */
PAGES.plugins = {
  id:'plugins', title:'插件', desc:'两处目录的 Claude Code 插件统一管理，改动下一条消息自动生效', legend:false,
  badge(){ const n = DB.plugins.filter(p=>p.latest).length; return n ? `<span class="nav-badge">${n}</span>` : ''; },
  render(el){
    el.innerHTML = `
    <div class="panel">
      <header class="panel-head"><h3>已安装插件</h3>
        <div class="panel-actions"><button class="btn sm" id="plCheck">检查更新</button></div></header>
      <div class="panel-body">
        <table><thead><tr><th>插件</th><th style="width:100px">市场</th><th style="width:130px">来源</th><th style="width:170px">版本</th><th style="width:84px">状态</th><th style="width:196px"></th></tr></thead>
        <tbody>${DB.plugins.map((p,i)=>`
          <tr><td><b>${esc(p.name)}</b></td><td>${esc(p.market)}</td>
          <td>${p.source==='bridge'?'<span class="tag warn">bridge 托管</span>':'<span class="tag off">本机 ~/.claude</span>'}</td>
          <td><span class="mono">v${esc(p.version)}</span> ${p.latest?`<span class="tag warn">→ v${esc(p.latest)}</span>`:''}</td>
          <td><span class="tag ${p.enabled?'ok':'off'}">${p.enabled?'已启用':'未启用'}</span></td>
          <td class="ops">
            <button class="btn sm" data-plupd="${i}">更新</button>
            <button class="btn sm" data-pltog="${i}">${p.enabled?'停用':'启用'}</button>
            <button class="btn sm danger" data-plrm="${i}">卸载</button></td></tr>`).join('')}
        </tbody></table>
      </div>
      <footer class="panel-foot">${I(IC.info,13)} bridge 托管目录优先加载；启停 / 更新后<b>下一条消息生效</b>，无须重启。</footer>
    </div>
    <div class="grid2" style="gap:16px;align-items:start">
      <div class="panel" style="margin:0">
        <header class="panel-head"><h3>从市场安装</h3></header>
        <div class="panel-body">
          <label class="fld">搜索插件 <span class="tip" data-tip="候选来自已添加市场的全部插件；也可在飞书端 /plugin install xxx@marketplace（仅管理员）">${I(IC.info,13)}</span></label>
          <div class="input-btn"><input type="text" id="plQ" placeholder="如 code-review、db-doc…"><button class="btn primary" id="plGo">安装</button></div>
          <label class="fld" style="margin-top:12px">安装到</label>
          <select id="plDir"><option value="user">本机 ~/.claude（推荐：本机 CLI 与桥接器共用一份）</option><option value="bridge">bridge 托管目录</option></select>
          <div class="sub-title" style="margin:16px 0 2px">市场可装（${DB.installTargets.available.length}）</div>
          ${DB.installTargets.available.map(a=>`<div class="urow" style="padding:8px 0">
            <div class="u-main"><div class="u-name">${esc(a.name)} <span class="tag off">${esc(a.market)}</span></div>
            <div class="u-sub">${esc(a.desc)}</div></div>
            <button class="btn sm" data-plainst="${esc(a.key)}">安装</button></div>`).join('')}
        </div>
      </div>
      <div class="panel" style="margin:0">
        <header class="panel-head"><h3>管理市场</h3></header>
        <div class="panel-body">
          <label class="fld">已添加</label>
          <div style="display:flex;flex-wrap:wrap;gap:7px">${DB.installTargets.markets.map(m=>`<span class="chip" style="font-family:inherit">${esc(m.name)}<span class="mut" style="font-family:inherit">· ${m.plugins} 插件</span></span>`).join('')}</div>
          <label class="fld" style="margin-top:14px">添加市场（git 地址或本机路径）</label>
          <div class="input-btn"><input type="text" id="plMk" placeholder="https://github.com/…/marketplace"><button class="btn" id="plMkAdd">添加</button></div>
          <label class="fld" style="margin-top:14px">批量</label>
          <div class="input-btn"><select id="plMkDir"><option value="user">本机 ~/.claude</option><option value="bridge">bridge 托管目录</option></select>
            <button class="btn" id="plUpdAll">全部更新</button></div>
          <div class="mini-note" style="margin-top:8px">「全部更新」= 刷新市场索引 + 逐个更新该目录已装插件（可中断查看日志）。</div>
        </div>
      </div>
    </div>`;
    $('#pageActions').innerHTML = '';
    $$('[data-plupd]').forEach(b=> b.onclick = async ()=>{
      const p = DB.plugins[+b.dataset.plupd];
      if (await confirmDlg({title:'更新插件', msg:`更新 <code>${esc(p.name)}</code> 到 v${esc(p.latest||p.version)}？更新后下一条消息按新版本加载。`, okText:'更新'})){ p.version = p.latest||p.version; p.latest=''; await fakeSave('插件已更新'); render(); }
    });
    $$('[data-pltog]').forEach(b=> b.onclick = async ()=>{
      const p = DB.plugins[+b.dataset.pltog];
      if (p.enabled && !(await confirmDlg({title:'停用插件', msg:`停用 <code>${esc(p.name)}</code>？停用后下一条消息不再加载，可随时再启用。`, okText:'停用'}))) return;
      p.enabled = !p.enabled; await fakeSave(p.enabled?'插件已启用':'插件已停用'); render();
    });
    $$('[data-plrm]').forEach(b=> b.onclick = async ()=>{
      const p = DB.plugins[+b.dataset.plrm];
      if (await confirmDlg({title:'卸载插件', msg:`卸载 <code>${esc(p.name)}</code>？卸载后需重新安装才能恢复，进行中的会话不受影响。`, danger:true, okText:'卸载'})){ DB.plugins.splice(+b.dataset.plrm,1); await fakeSave('插件已卸载'); render(); }
    });
    $$('[data-plainst]').forEach(b=> b.onclick = async ()=>{
      b.disabled = true; b.textContent = '安装中…'; await sleep(800);
      const key = b.dataset.plainst; const [name, market] = key.split('@');
      DB.plugins.push({ name, market, source: $('#plDir').value, version:'1.0.0', latest:'', enabled:true });
      await fakeSave(`${name} 已安装`); render();
    });
    $('#plGo').onclick = ()=> toast('原型：请从左侧「市场可装」列表点安装，或输入关键词后从候选选择');
    $('#plCheck').onclick = async (e)=>{ const b=e.currentTarget; b.disabled=true; b.innerHTML='<span class="spin"></span>检查中'; await sleep(900); b.disabled=false; b.textContent='检查更新'; const n=DB.plugins.filter(p=>p.latest).length; toast(n?`${n} 个插件有新版本（见列表「→ 版本」标注）`:'所有插件均为最新版本'); };
    $('#plMkAdd').onclick = async ()=>{ const v=$('#plMk').value.trim(); if(!v) return toast('请填写 marketplace git 地址或本机路径', true); DB.installTargets.markets.push({name:v.split('/').pop().replace(/\.git$/,''), plugins:0}); await fakeSave('市场已添加'); render(); };
    $('#plUpdAll').onclick = async ()=>{ if (await confirmDlg({title:'全部更新', msg:'将刷新市场索引，并逐个更新所选目录下全部已装插件。确定继续？', okText:'全部更新'})){ await sleep(600); await fakeSave('全部更新完成'); render(); } };
  },
};

/* ═══════════ 页面：Skills ═══════════ */
const SK_SOURCE = (s)=>{
  if (s.source==='project') return `项目级 · ${esc(s.ws||'?')}`;
  if (s.source==='plugin') return `插件 · ${esc(s.plugin||'?')}${s.enabled===false?'（未启用）':''}`;
  if (s.source==='bridge') return '用户级 · bridge';
  return '用户级 · 本机';
};
const SK_FILES = {
  'content-produce': {
    'SKILL.md': `---\nname: content-produce\ndescription: 内容生产主编排：像素级复刻指定链接，结合产品生成图文\n---\n\n# 内容生产主编排\n\n统筹任务分配，不亲自执行具体任务。\n\n## 流程\n1. explore-product / explore-ip-profile 归纳素材\n2. fetch-content 拆解目标写法\n3. generate-content 生成正文与配图提示词\n4. generate-images 出图、assemble-content 校验回填\n5. publish 人工审核后发布`,
    'references/tone.md': `# 语气参考\n\n- 短句为主，先结论后展开\n- 用户视角说人话，避免堆术语\n- 每段只讲一件事`,
    'scripts/render.js': `// 渲染脚本示例\nexport function render(data) {\n  return \`<h1>\${data.title}</h1>\`;\n}`,
  },
};
const skFile = (name, path)=> (SK_FILES[name] && SK_FILES[name][path]) || `# ${path}\n\n（原型演示：此处展示该文件内容。）`;

function skillDrawer(s){
  const files = SK_FILES[s.name] ? Object.keys(SK_FILES[s.name]) : ['SKILL.md'];
  openDrawer({
    title:`${s.name} · 文件浏览`,
    body:`<div class="mini-note" style="margin-bottom:10px"><code>${esc(s.path||'')}</code></div>
      <div class="dw-layout">
        <nav class="dw-nav" id="skTree" style="width:200px"></nav>
        <div class="dw-pane">
          <div class="mut" id="skName" style="font-size:12px;margin-bottom:8px"></div>
          <pre id="skView" style="margin:0;background:var(--sunk);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:12px;line-height:1.75;overflow:auto;max-height:58vh;white-space:pre-wrap;font-family:var(--mono)"></pre>
        </div>
      </div>`,
    foot:`<span class="sp"></span><button class="btn" id="skClose">关闭</button>`,
  });
  $('#skClose').onclick = closeDrawer;
  const open = (f)=>{
    $('#skName').textContent = f;
    $('#skView').textContent = skFile(s.name, f);
    $$('#skTree button').forEach(b=> b.classList.toggle('active', b.dataset.f===f));
  };
  $('#skTree').innerHTML = files.map(f=>`<button data-f="${esc(f)}" style="${f.includes('/')?'padding-left:24px':''}">📄 ${esc(f.split('/').pop())}</button>`).join('');
  $$('#skTree button').forEach(b=> b.onclick = ()=> open(b.dataset.f));
  open(files[0]);
}

PAGES.skills = {
  id:'skills', title:'Skills', desc:'四个来源的技能聚合：本机 / bridge / 项目 / 插件（只读）', legend:false,
  render(el){
    el.innerHTML = `
    <div class="panel">
      <header class="panel-head"><h3>技能列表</h3>
        <div class="panel-actions">
          <input type="search" id="skQ" placeholder="过滤：名字 / 来源 / 路径…" style="width:210px;padding:4px 10px;font-size:12.5px">
          <button class="btn sm" id="skZip">导入 zip</button>
          <button class="btn primary sm" id="skAdd">＋ 新建</button>
        </div></header>
      <div class="panel-body">
        <table><thead><tr><th style="width:220px">名字</th><th>说明</th><th style="width:190px">来源</th><th style="width:130px"></th></tr></thead>
        <tbody id="skBody"></tbody></table>
      </div>
      <footer class="panel-foot">${I(IC.info,13)} 新增 / 导入统一落盘用户级生效目录 <code>.lark-claudecode-bridge/claude/skills</code>；改动即时生效。</footer>
    </div>`;
    const drawRows = ()=>{
      $('#skBody').innerHTML = DB.skills.map((s,i)=>`
        <tr data-skt="${esc((s.name+' '+SK_SOURCE(s)+' '+(s.path||'')+' '+(s.desc||'')).toLowerCase())}">
          <td><b>${esc(s.name)}</b>${s.path?`<div class="mini-note" style="margin-top:2px"><code>${esc(s.path)}</code></div>`:''}</td>
          <td>${esc(s.desc)||'<span class="mut">（无说明）</span>'}</td>
          <td><span class="tag ${s.source==='bridge'?'info':s.source==='plugin'?(s.enabled===false?'warn':'off'):'ghost'}">${SK_SOURCE(s)}</span></td>
          <td class="ops"><button class="btn sm" data-skview="${i}">查看</button>
            ${(s.source!=='project'&&s.source!=='plugin')?`<button class="btn sm danger" data-skdel="${i}">删除</button>`:'<span class="dim" style="font-size:11.5px">只读</span>'}</td>
        </tr>`).join('') || '<tr class="empty"><td colspan="4">暂无 skill（四个来源均未发现 SKILL.md）</td></tr>';
      $$('[data-skview]').forEach(b=> b.onclick = ()=> skillDrawer(DB.skills[+b.dataset.skview]));
      $$('[data-skdel]').forEach(b=> b.onclick = async ()=>{
        const s = DB.skills[+b.dataset.skdel];
        if (await confirmDlg({title:'删除 skill', msg:`删除 <b>${esc(s.name)}</b>（${SK_SOURCE(s)}）？目录会被整体移除，不可恢复。`, danger:true, okText:'删除'})){ DB.skills.splice(+b.dataset.skdel,1); await fakeSave('skill 已删除'); render(); }
      });
    };
    drawRows();
    $('#skQ').oninput = (e)=>{
      const q = e.target.value.trim().toLowerCase();
      $$('#skBody tr[data-skt]').forEach(tr=> tr.hidden = q && !tr.dataset.skt.includes(q));
    };
    $('#skZip').onclick = ()=> toast('原型：此处选择 zip 导入（≤10MB，落盘用户级目录）');
    $('#skAdd').onclick = ()=>{
      openDrawer({ title:'新建 skill（用户级）', narrow:true,
        body:`<label class="fld">名字（字母 / 数字 / 连字符，1-64 位）</label><input type="text" id="nskName" placeholder="my-skill">
              <label class="fld">说明（frontmatter description）</label><input type="text" id="nskDesc" placeholder="这个 skill 做什么、什么时候用">
              <div class="mini-note" style="margin-top:10px">创建后生成目录与 SKILL.md 模板，请到目录中补充正文与脚本。</div>`,
        foot:`<span class="sp"></span><button class="btn" id="nskCancel">取消</button><button class="btn primary" id="nskSave">创建</button>` });
      $('#nskCancel').onclick = closeDrawer;
      $('#nskSave').onclick = async ()=>{
        const name = $('#nskName').value.trim();
        if (!name) return toast('请填写名字', true);
        DB.skills.push({ name, desc:$('#nskDesc').value.trim(), source:'bridge', path:'.lark-claudecode-bridge/claude/skills/'+name });
        if (await fakeSave('已创建（含默认 SKILL.md 模板）')){ closeDrawer(); render(); }
      };
    };
  },
};

/* ═══════════ 页面：MCP ═══════════ */
const MCP_ENV = {
  github:[{k:'GITHUB_TOKEN', raw:'${GITHUB_TOKEN:-}', missing:true}],
};
const mcpSource = (s)=> s.source==='plugin' ? `插件 · ${esc(s.plugin||'?')}` : s.source==='project' ? '项目级' : s.source==='bridge' ? 'bridge · 可管理' : '用户级 · 本机';
function mcpDrawer(s){
  const editable = s.source==='bridge';
  const cfg = s.type==='stdio' ? { type:'stdio', command:s.conn } : { type:s.type, url:s.conn };
  const envs = MCP_ENV[s.name]||[];
  const renderEnv = ()=> envs.length ? envs.map(e=>`
    <tr><td><code>${esc(e.k)}</code></td><td><code>${esc(e.raw)}</code></td>
    <td>${e.missing?'<span style="color:var(--err-tx)">未设置（展开后为空）</span>':`<code>${esc(e.raw)}</code>`}</td></tr>`).join('')
    : '<tr><td colspan="3" class="mut">（无 env 配置）</td></tr>';
  openDrawer({
    title:`MCP · ${s.name}`,
    body:`<div class="mini-note" style="margin-bottom:8px">来源：${mcpSource(s)}</div>
      ${s.source!=='bridge'&&s.source!=='user'?'<div class="banner warn" style="margin-bottom:10px">只读来源——此 MCP 由插件 / 项目自带，请到对应目录修改。</div>':''}
      ${s.source==='user'?'<div class="banner warn" style="margin-bottom:10px">本机 ~/.claude.json 来源不支持页面编辑（可删除）；如需修改请手动改，或删除后到本页重新添加。</div>':''}
      <label class="fld">配置（JSON${editable?'，可编辑':''}）</label>
      <textarea id="mcJson" rows="8" ${editable?'':'readonly'}>${esc(JSON.stringify(cfg,null,2))}</textarea>
      <label class="fld" style="margin-top:12px">环境变量 <span class="tip" data-tip="当前值已合并：飞书应用 env › Claude 认证 env › settings.json env › 系统环境，支持 \${VAR:-默认值}">${I(IC.info,13)}</span></label>
      <table><thead><tr><th style="width:150px">变量</th><th>配置值</th><th>当前值</th></tr></thead><tbody>${renderEnv()}</tbody></table>`,
    foot:`${editable?'<button class="btn" id="mcEdit">编辑</button><button class="btn primary" id="mcSave" style="display:none">保存</button>':''}<span class="sp"></span><button class="btn" id="mcClose">关闭</button>`,
  });
  $('#mcClose').onclick = closeDrawer;
  if (editable){
    $('#mcEdit').onclick = ()=>{ $('#mcJson').removeAttribute('readonly'); $('#mcEdit').style.display='none'; $('#mcSave').style.display=''; };
    $('#mcSave').onclick = async ()=>{
      try{ JSON.parse($('#mcJson').value); }catch(err){ return toast('JSON 解析失败：'+err.message, true); }
      if (await fakeSave('已保存（任务级热生效，无须重启）')){ closeDrawer(); render(); }
    };
  }
}

PAGES.mcp = {
  id:'mcp', title:'MCP', desc:'四个来源的 MCP server 聚合；bridge 来源页面可管理，任务级热生效', legend:false,
  render(el){
    el.innerHTML = `
    <div class="panel">
      <header class="panel-head"><h3>MCP Servers</h3>

          <td class="ops"><button class="btn sm" data-mcview="${i}">查看</button>

        </tr>`).join('') || '<tr class="empty"><td colspan="5">暂无 MCP server</td></tr>';
      $$('[data-mcst]').forEach(c=> c.onclick = async ()=>{
        const s = DB.mcp[+c.dataset.mcst];
        c.innerHTML = '<span class="mut">检测中…</span>'; await sleep(700);
        c.innerHTML = s.status==='ok'?'<span style="color:var(--ok-tx)">✔ 正常</span>':s.status==='warn'?`<span style="color:var(--warn-tx)">⚠ 不可达</span><div class="mini-note">${esc(s.detail||'')}</div>`:'<span style="color:var(--ok-tx)">✔ 正常</span>';
      });
      $$('[data-mcview]').forEach(b=> b.onclick = ()=> mcpDrawer(DB.mcp[+b.dataset.mcview]));
      $$('[data-mcdel]').forEach(b=> b.onclick = async ()=>{
        const s = DB.mcp[+b.dataset.mcdel];
        if (await confirmDlg({title:'删除 MCP server', msg:`删除 <b>${esc(s.name)}</b>（${mcpSource(s)}）？引用它的任务将无法启动该 server。`, danger:true, okText:'删除'})){ DB.mcp.splice(+b.dataset.mcdel,1); await fakeSave('已删除'); render(); }
      });
    };
    drawRows();
    $('#mcQ').oninput = (e)=>{ const q=e.target.value.trim().toLowerCase(); $$('#mcBody tr[data-mct]').forEach(tr=> tr.hidden = q && !tr.dataset.mct.includes(q)); };
    $('#mcRefresh').onclick = ()=>{ drawRows(); toast('已刷新（原型演示）'); };
    $('#mcAdd').onclick = ()=>{
      openDrawer({ title:'添加 MCP（存 bridge 自管目录）',
        body:`<div class="subtabs"><button class="active" data-at="cmd">原生命令</button><button data-at="json">JSON 配置</button></div>
          <div data-ap="cmd"><label class="fld">粘贴 claude mcp add 命令（自动解析）</label>
            <textarea id="amCmd" placeholder='claude mcp add my-mcp -e API_KEY=xxx -- npx -y @scope/mcp-server'></textarea>
            <div class="mini-note" style="margin-top:6px">名字取命令第 4 个参数；scope（-s）忽略，统一存 bridge 目录。</div></div>
          <div data-ap="json" style="display:none"><label class="fld">名字</label><input type="text" id="amName" placeholder="my-mcp">
            <label class="fld">配置 JSON</label>
            <textarea id="amCfg" placeholder='{"type":"stdio","command":"npx","args":["-y","mcp-server-foo"]}'></textarea></div>`,
        foot:`<span class="sp"></span><button class="btn" id="amCancel">取消</button><button class="btn primary" id="amSave">添加</button>` });
      $$('.subtabs [data-at]').forEach(b=> b.onclick = ()=>{
        $$('.subtabs [data-at]').forEach(x=> x.classList.toggle('active', x===b));
        $('[data-ap=cmd]').style.display = b.dataset.at==='cmd'?'':'none';
        $('[data-ap=json]').style.display = b.dataset.at==='json'?'':'none';
      });
      $('#amCancel').onclick = closeDrawer;
      $('#amSave').onclick = async ()=>{
        const isCmd = $('[data-ap=cmd]').style.display !== 'none';
        let name;
        if (isCmd){
          const cmd = $('#amCmd').value.trim();
          if (!cmd) return toast('请粘贴 claude mcp add 命令', true);
          name = cmd.split(/\s+/)[3] || '';
          if (!name) return toast('命令中缺少名字（claude mcp add <名字> …）', true);
          DB.mcp.push({ name, type:'stdio', conn:cmd.split('-- ').pop()||cmd, source:'bridge', status:'untested' });
        } else {
          name = $('#amName').value.trim();
          const raw = $('#amCfg').value.trim();
          if (!name) return toast('请填写名字', true);
          let cfg; try{ cfg = JSON.parse(raw); }catch(err){ return toast('JSON 解析失败：'+err.message, true); }
          DB.mcp.push({ name, type:cfg.type||'stdio', conn:cfg.command||cfg.url||'', source:'bridge', status:'untested' });
        }
        if (await fakeSave('已添加（任务级热生效，无须重启）')){ closeDrawer(); render(); }
      };
    };
  },
};
