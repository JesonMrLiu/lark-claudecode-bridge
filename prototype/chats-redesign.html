<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LCB 会话页改版原型 · 「用户 + /new」维度</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --border:#e3e6eb; --tx:#24292f; --dim:#6b7280;
  --pri:#2563eb; --pri-tx:#fff; --ok-tx:#1a7f37; --err-tx:#cf222e; --warn-tx:#9a6700;
  --off-bg:#f0f1f3; --off-tx:#57606a; --info-bg:#ddf4ff; --info-tx:#0969da;
  --ok-bg:#dafbe1; --err-bg:#ffebe9;
  --me-bubble:#e3f0fb; --ai-bubble:#f3f4f6; --mark:#fff3a3; --active-bg:#eef4ff;
}
[data-theme=dark]{
  --bg:#0d1117; --panel:#161b22; --border:#30363d; --tx:#e6edf3; --dim:#8b949e;
  --pri:#3b82f6; --pri-tx:#fff; --ok-tx:#3fb950; --err-tx:#f85149; --warn-tx:#d29922;
  --off-bg:#21262d; --off-tx:#8b949e; --info-bg:#12233d; --info-tx:#58a6ff;
  --ok-bg:#12261e; --err-bg:#2d1517;
  --me-bubble:#1f3a5f; --ai-bubble:#21262d; --mark:#5c4a00; --active-bg:#1c2740;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.65 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--pri)}
/* ===== 原型说明条（仅原型存在） ===== */
.proto-bar{position:sticky;top:0;z-index:9;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--border)}
.proto-bar b{font-size:14px}
.proto-note{font-size:11.5px;color:var(--dim)}
.scene-tab{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.scene-tab button{border:0;background:transparent;color:var(--dim);padding:5px 14px;cursor:pointer;font-size:12.5px}
.scene-tab button.on{background:var(--pri);color:var(--pri-tx)}
.btn{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--border);background:var(--panel);
  color:var(--tx);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px}
.btn.primary{background:var(--pri);border-color:var(--pri);color:var(--pri-tx)}
.btn.sm{padding:3px 10px;font-size:12.5px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--dim)}
input[type=search]{border:1px solid var(--border);border-radius:8px;padding:6px 12px;background:var(--bg);color:var(--tx);font-size:13px;outline:none}
input[type=search]:focus{border-color:var(--pri)}
select{border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--panel);color:var(--tx);font-size:13px}
/* ===== 布局 ===== */
.wrap{max-width:1280px;margin:0 auto;padding:14px 18px 40px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:14px}
.panel-head{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.panel-head h3{margin:0;font-size:14.5px}
.panel-sub{font-size:12px;color:var(--dim)}
.panel-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.panel-body{padding:14px 16px}
.mini-note{font-size:11.5px;color:var(--dim)}
.tag{display:inline-block;font-size:11px;line-height:1;padding:3px 7px;border-radius:5px;vertical-align:1px}
.tag.off{background:var(--off-bg);color:var(--off-tx)}
.tag.ok{background:var(--ok-bg);color:var(--ok-tx)}
.tag.err{background:var(--err-bg);color:var(--err-tx)}
.tag.info{background:var(--info-bg);color:var(--info-tx)}
.dim{color:var(--dim)}
/* ===== 会话双栏 ===== */
.chats-layout{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}
.chat-list-panel{max-height:calc(100vh - 300px);overflow:auto;border-top:1px solid var(--border)}
.chat-obj{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.chat-obj:hover{background:var(--active-bg)}
.chat-obj.active{background:var(--active-bg);box-shadow:inset 3px 0 0 var(--pri)}
.c-ava{flex:none;width:34px;height:34px;border-radius:9px;background:var(--pri);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.c-ava.group{background:var(--off-tx)}
.c-main{flex:1;min-width:0}
.c-top{display:flex;gap:8px;align-items:baseline}
.c-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-time{margin-left:auto;flex:none;font-size:11px;color:var(--dim)}
.c-prev{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-badges{margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.anno{flex:none;width:17px;height:17px;border-radius:50%;background:var(--warn-tx);color:#fff;
  font-size:11px;line-height:17px;text-align:center;margin-left:auto}
/* ===== 详情 ===== */
#chDetail{min-height:440px}
.kw-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.chats-scroll{max-height:calc(100vh - 330px);overflow:auto;padding:4px 2px 10px}
.cmsg-day{text-align:center;font-size:11.5px;color:var(--dim);margin:14px 0 8px}
.cmsg-day b{background:var(--off-bg);border-radius:6px;padding:2px 10px;font-weight:500}
.cmsg{display:flex;gap:10px;margin:10px 0}
.cmsg.me{flex-direction:row-reverse}
.m-ava{flex:none;width:30px;height:30px;border-radius:8px;background:var(--off-tx);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px}
.cmsg.me .m-ava{background:var(--pri)}
.m-body{max-width:min(76%,740px)}
.m-meta{font-size:11.5px;color:var(--dim);margin-bottom:3px}
.cmsg.me .m-meta{justify-content:flex-end}
.m-bubble{background:var(--ai-bubble);border-radius:10px;padding:9px 13px;font-size:13.5px;word-break:break-word}
.cmsg.me .m-bubble{background:var(--me-bubble)}
.m-bubble p{margin:4px 0}
.m-bubble ul{margin:4px 0;padding-left:20px}
.m-bubble code{background:var(--off-bg);border-radius:4px;padding:1px 5px;font-size:12.5px}
.m-link{margin-top:4px}
.csum{border:1px solid var(--border);border-left:3px solid var(--pri);border-radius:9px;padding:8px 12px;margin:8px 0 4px 40px;font-size:12.5px}
.cmsg.me ~ .csum{margin-left:0;margin-right:40px}
.csum-top{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.csum-top b{font-size:12.5px}
.csum-stats{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:12px}
.csum-stats b{color:var(--tx)}
details.adv{font-size:12.5px;color:var(--dim)}
details.adv summary{cursor:pointer;user-select:none}
details.adv .mono{font-family:Consolas,monospace;font-size:12px}
.kw-active{outline:2px solid var(--warn-tx);outline-offset:3px;border-radius:8px}
mark.kw-mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
/* ===== 图例 ===== */
.legend{border:1px dashed var(--border);border-radius:12px;padding:12px 16px;margin-top:14px}
.legend h4{margin:0 0 6px;font-size:13px}
.legend ol{margin:0;padding-left:20px;font-size:12.5px;color:var(--dim)}
.legend li{margin:2px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--tx);color:var(--bg);
  border-radius:8px;padding:7px 16px;font-size:12.5px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.show{opacity:.92}
</style>
</head>
<body>

<div class="proto-bar">

  <span class="scene-tab">
    <button id="tabPrivate" class="on">场景 A · 私聊</button>
    <button id="tabGroup">场景 B · 群聊</button>
  </span>
  <span style="margin-left:auto;display:flex;gap:8px">

    </div>
  </div>

  <div class="chats-layout">
    <!-- ② 左：会话列表（用户 + /new 维度，平铺，时间降序） -->
    <div class="panel" style="margin:0">
      <header class="panel-head"><h3>会话列表</h3>
        <div class="panel-actions"><span class="tag off" id="cnt">6 个会话</span></div></header>
      <div style="padding:10px 12px 8px"><input type="search" id="listQ" placeholder="搜索会话：标题 / 用户 / 群名" style="width:100%"></div>
      <div class="chat-list-panel" id="list"></div>
    </div>
    <!-- ③ 右：会话内容（话题/时间/成员退化为只读展示，只剩关键词） -->
    <div class="panel" style="margin:0" id="chDetail"></div>
  </div>

  <!-- 编号图例（随场景切换） -->
  <div class="legend"><h4>呈现效果对照（编号对应列表/详情里的圆形角标）</h4><ol id="legend"></ol></div>
</div>

<div class="toast" id="toast"></div>

          { date:'10-12', time:'09:30', user:'李四', prompt:'@小助手 搭一个内部文档搜索服务，要能按关键词全文检索。',
            reply:'<p>方案：SQLite FTS5 全文索引 + 轻量 HTTP 服务，目录监听增量更新。</p>',
            result:{badge:'已完成', tools:9, turns:4, files:2} },
          { date:'10-12', time:'09:55', user:'王五', prompt:'@小助手 中文分词效果怎么样？给我一个测试样例。',
            reply:'<p>FTS5 默认按 trigram 切，中文子串召回没问题；样例见 <code>demo.http</code>。</p>',
            result:{badge:'已完成', tools:2, turns:1, files:1} },
        ]},
    ],
  },
};

/* ================= 渲染 ================= */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let scene = 'private', current = null, hits = [], hitAt = 0;

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1600); }

function typeTag(t){ return t === 'group' ? '<span class="tag info">群聊</span>' : '<span class="tag off">私聊</span>'; }
function memberLine(s){
  if (s.type !== 'group') return '';
  return `<span class="hint" style="font-size:11px;color:var(--dim)">成员：${esc(s.members.join('、'))}</span>`;
}

function renderList(){
  const data = SCENES[scene];
  const kw = ($('#listQ').value || '').trim().toLowerCase();
  $('#list').innerHTML = data.sessions.map((s, i) => `
    <div class="chat-obj ${current?.id === s.id ? 'active' : ''}" data-i="${i}">
      <span class="c-ava ${s.type === 'group' ? 'group' : ''}">${esc((s.members[0] || '?')[0])}</span>
      <div class="c-main">
        <div class="c-top"><span class="c-name">${esc(s.title)}</span><span class="c-time">${esc(s.time)}</span></div>
        <div class="c-prev">${esc(s.user)} · ${s.type === 'group' ? esc(s.chat) : '私聊'} · ${s.tasks.length} 条任务</div>
        <div class="c-badges">${typeTag(s.type)}${memberLine(s)}</div>
      </div>
      ${s.anno ? `<span class="anno">${s.anno}</span>` : ''}
    </div>`).join('');
  $('#cnt').textContent = `${data.sessions.length} 个会话`;
  $('#list').querySelectorAll('.chat-obj').forEach((n) => {
    const s = data.sessions[Number(n.dataset.i)];
    const hay = `${s.title} ${s.user} ${s.chat}`.toLowerCase();
    n.hidden = !!kw && !hay.includes(kw);          // 搜索：标题/用户/群名过滤
    n.onclick = () => { current = s; renderList(); renderDetail(s); };
  });
}

function renderDetail(s){
  const first = s.tasks[0], last = s.tasks[s.tasks.length - 1];
  $('#chDetail').innerHTML = `
    <header class="panel-head" style="padding-bottom:12px">
      <h3>${esc(s.title)}</h3> ${typeTag(s.type)}
      <div class="panel-actions">
        <button class="btn sm" id="copyId">⧉ 复制会话 ID</button>
        <button class="btn sm" id="refresh" title="重拉本会话记录">↻</button>
      </div></header>
    <div class="panel-body" style="padding-top:10px">
      <div class="mini-note" style="margin-bottom:8px">
        ${esc(s.chat)} · 成员：${esc(s.members.join('、'))} · 时间范围：<b>${esc(s.range)}</b>
      </div>
      <div class="kw-row">
        <input type="search" id="kw" placeholder="关键词：定位对话…" style="width:200px">
        <button class="btn sm primary" id="kwGo">查询</button>
        <span id="kwNav" hidden style="display:inline-flex;gap:6px;align-items:center">
          <span class="mini-note" id="kwPos"></span>
          <button class="btn sm" id="kwPrev">↑</button><button class="btn sm" id="kwNext">↓</button>
          <button class="btn sm ghost" id="kwClear">✕</button></span>
      </div>
      <div class="chats-scroll" id="tl"></div>
    </div>`;
  $('#copyId').onclick = async () => { try { await navigator.clipboard.writeText(`${scene}-${s.id}-a1b2c3d4e5f6`); toast('会话 ID 已复制（mock）'); } catch { toast('复制失败'); } };
  $('#refresh').onclick = () => toast('原型：已重渲染（mock 数据）');
  $('#tl').innerHTML = s.tasks.map((t, i) => {
    const firstOfDate = i === 0 || s.tasks[i - 1].date !== t.date;
    return `${firstOfDate ? `<div class="cmsg-day"><b>${esc(t.date)}</b></div>` : ''}
    <div class="cmsg me">
      <span class="m-ava">${esc(t.user[0])}</span>
      <div class="m-body">
        <div class="m-meta">${esc(t.user)} <span>·</span> ${esc(t.time)}</div>
        <div class="m-bubble" data-prompt="${i}">${esc(t.prompt)}</div>
      </div>
    </div>
    <div class="cmsg">
      <span class="m-ava">小</span>
      <div class="m-body">
        <div class="m-meta">小助手 <span>·</span> ${esc(t.time)}</div>
        <div class="m-bubble" data-reply="${i}">${t.reply}<button class="btn sm ghost m-link" data-md="${i}">查看原文</button></div>
      </div>
    </div>
    <div class="csum">
      <div class="csum-top"><b>任务执行摘要</b><span class="tag ${t.result.badge === '已完成' ? 'ok' : 'err'}">${esc(t.result.badge)}</span></div>
      <div class="csum-stats">
        <span>工具调用 <b>${t.result.tools}</b> 次</span><span>对话轮次 <b>${t.result.turns}</b> 轮</span>
        ${t.result.files ? `<span>产出文件 <b>${t.result.files}</b> 个</span>` : ''}<span>时间 <b>${esc(t.time)}</b></span>
      </div>
    </div>`;
  }).join('');
  $('#tl').querySelectorAll('[data-md]').forEach((b) => {
    b.onclick = () => { b.textContent = b.textContent === '查看原文' ? 'Markdown 视图' : '查看原文'; toast('原型：Markdown ↔ 纯文本切换'); };
  });
  // 关键词定位（简化版：查询制 → n/m 导航 + 高亮 + 滚动）
  const runKw = () => {
    const kw = $('#kw').value.trim().toLowerCase(); hits = []; hitAt = 0;
    if (kw) s.tasks.forEach((t, i) => { if (`${t.prompt}${t.reply.replace(/<[^>]+>/g, '')}`.toLowerCase().includes(kw)) hits.push(i); });
    $('#tl').querySelectorAll('.kw-active').forEach((n) => n.classList.remove('kw-active'));
    $('#tl').querySelectorAll('mark').forEach((m) => m.outerHTML = m.textContent);
    if (!hits.length) { $('#kwNav').hidden = true; if (kw) toast('没有命中'); return; }
    $('#kwNav').hidden = false; gotoHit();
  };
  const gotoHit = () => {
    hitAt = ((hitAt % hits.length) + hits.length) % hits.length;
    $('#kwPos').textContent = `第 ${hitAt + 1}/${hits.length} 处`;
    const idx = hits[hitAt];
    const node = $('#tl').querySelector(`[data-prompt="${idx}"]`);
    $('#tl').querySelectorAll('.kw-active').forEach((n) => n.classList.remove('kw-active'));
    if (node) { node.classList.add('kw-active'); node.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  };
  $('#kwGo').onclick = runKw;
  $('#kw').onkeydown = (e) => { if (e.key === 'Enter') runKw(); };
  $('#kwPrev').onclick = () => { hitAt--; gotoHit(); };
  $('#kwNext').onclick = () => { hitAt++; gotoHit(); };
  $('#kwClear').onclick = () => { $('#kw').value = ''; runKw(); };
}

function renderScene(key){
  scene = key; current = SCENES[key].sessions[0];   // 进页默认选中时间降序第一条
  $('#tabPrivate').classList.toggle('on', key === 'private');
  $('#tabGroup').classList.toggle('on', key === 'group');
  $('#legend').innerHTML = SCENES[key].legend.map((t) => `<li>${t}</li>`).join('');
  renderList(); renderDetail(current);
}

$('#tabPrivate').onclick = () => renderScene('private');
$('#tabGroup').onclick = () => renderScene('group');
$('#listQ').oninput = renderList;
$('#themeBtn').onclick = () => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('#themeBtn').textContent = dark ? '☀️ 亮色' : '🌙 暗色';
};
renderScene('private');
</script>
</body>
</html>
