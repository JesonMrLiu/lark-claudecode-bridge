# 多机器人：apps 数组，每个应用一条独立长连接 + 独立会话池；机器人间仅会话隔离。
# 所有机器人共用本机 ~/.claude：模型设置(settings.json)、登录态、user 级 MCP、skills、
# 已启用的 marketplace 插件全部自动继承，无须在此重复配置认证/模型。
# 升级提示：旧版单应用 feishu: 格式仍可直接使用（启动时自动归一化，首次 lcb app add 时原地转格式）。
# 快捷操作：在飞书开放平台后台「应用功能 → 机器人 → 机器人菜单」配置菜单项
#   （如「内容生成」→ 发送消息 /content-producer:content-producer），点击即触发对应技能/插件。
apps:
  - name: 主力助手            # 显示名（日志前缀 / /status / lcb app list），缺省取 app_id
    app_id: cli_xxxx          # 飞书开放平台 → 凭证与基础信息
    app_secret: xxxx
    # domain: lark            # 国际版 Lark 才需要
    # default_workspace: demo # 该机器人的默认工作区（须在 workspaces 列表内），缺省用全局 defaults.workspace
    # concurrency: 2          # 该机器人的并发上限（1-100），缺省用全局 concurrency
    # append_system_prompt: '你是我的素材收集助手'  # 可选人格补充（多机器人差异化定位的主要手段）
    # env:                    # per-app 环境变量（注意：~/.claude/settings.json 的 env 优先级更高，
    #                           此处适合放 settings.json 里没有的键）
    #   SOME_PLUGIN_KEY: xxx
    # triggers:               # 触发词映射：命中即把消息改写为 rewrite 再入队（按序首个命中生效）。
    #                          # 通常无须配置：未命中触发词的 /xxx 消息会原文透传给 Claude Code
    #                          自动展开斜杠命令（可触发 skills / 插件命令，如 /superpowers:brainstorming）；
    #                          仅在需要改写参数/附加指令时才配触发词。
    #                          match 以 / 开头 = 首 token 精确匹配（/produce 命中、/produced 不命中），
    #                          否则 = 整条消息包含该关键词即命中；{text}=原文全文，{args}=去掉首 token 的剩余参数。
    #                          /stop /new /help 等本地命令永远优先，不会被劫持。改动写盘后下一条消息即热生效。
    #   - match: /produce
    #     rewrite: '调用 content-producer 插件的主技能（skills/content-producer/SKILL.md）执行内容生产流程，严格遵循其编排。任务参数：{args}'
    #   - match: 写文章
    #     rewrite: '调用 content-producer 插件的主技能（skills/content-producer/SKILL.md）执行内容生产流程，严格遵循其编排。任务描述：{text}'
    # plugins:                # 通常无须配置：~/.claude 已启用的插件自动加载（随 CLI 的 /plugin install 变化）。
    #                          显式配置用于开发期直指源码目录（改 SKILL.md 即生效，无需重装）；
    #                          与自动发现同名时显式优先。插件的 MCP/hooks 随之加载。
    #   - name: content-producer
    #     path: F:/workspace/plugins/content-producer/plugin
  # - name: 素材收集           # 再添一个机器人：复制上面的结构即可（会话池独立，配置共享 ~/.claude）
  #   app_id: cli_yyyy
  #   app_secret: yyyy
workspaces:                    # 工作区白名单：名字 + 路径（所有机器人共享列表，当前使用哪个 per-app 隔离）
  - name: demo
    path: F:\workspace\demo
    # type: code-dev           # 工作区类型：code-dev = 代码开发（每个任务先出计划 → 飞书卡片批准后自动执行；
                               # 收尾发汇总 diff 卡片，不再整文件上传，git 仓库专属）；缺省 generic = 通用
  # - name: my-project
  #   path: F:\workspace\my-project
  #   type: code-dev
defaults:
  workspace: demo
concurrency: 3                 # 全局并发上限（未单独配置的 app 沿用此值）
# permissions:                # 工具白名单（整块可选；未配置的字段用内置默认）。改后重启 bridge 生效
#   allow_tools:              # 免确认直通工具名。配置即整体替换内置默认（不与默认合并）！
#                             # 内置默认 = Read/Glob/Grep/LS/TodoRead/TodoWrite/WebFetch/WebSearch/Bash
#                             # （Bash 默认放行读命令；安全性由 dangerous_commands 黑名单兜底）
#   - Read
#   - Glob
#   - Grep
#   - LS
#   - TodoRead
#   - TodoWrite
#   - WebFetch
#   - WebSearch
#   - Bash
#   dangerous_commands:       # Bash 危险命令正则（对命令全文匹配，命中弹确认卡）；缺省内置
#                             # rm -rf / sudo / git push --force / git reset --hard / mkfs /
#                             # dd if= / chmod 777 / curl|wget 管道执行脚本 / shutdown|reboot
#   - 'rm\s+-rf'
#   - 'sudo\s'
# transcripts:                # 对话落盘清理策略；缺省 = 永久保留
#   retention_days: 90
