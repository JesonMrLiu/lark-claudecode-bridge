# 多机器人：apps 数组，每个应用一条独立长连接 + 独立会话池；机器人间仅会话隔离。
# 所有机器人共用本机 ~/.claude：模型设置(settings.json)、登录态、user 级 MCP、skills、
# 已启用的 marketplace 插件全部自动继承，无须在此重复配置认证/模型。
# 升级提示：旧版单应用 feishu: 格式仍可直接使用（启动时自动归一化，首次 lcb app add 时原地转格式）。
# 快捷操作：推荐用「斜杠命令」（配置页一键同步，输入 / 选择后可继续输入描述）；
#   备选机器人菜单（开放平台后台配置，点击即发送）：如「内容生成」→ 发送消息 /content-producer:content-producer。
apps:
  - name: 主力助手            # 显示名（日志前缀 / /status / lcb app list），缺省取 app_id
    app_id: cli_xxxx          # 飞书开放平台 → 凭证与基础信息
    app_secret: xxxx
    # domain: lark            # 国际版 Lark 才需要
    # default_workspace: demo # 该机器人的默认工作区（须在 workspaces 列表内），缺省用全局 defaults.workspace
    # concurrency: 2          # 该机器人的并发上限（1-100），缺省用全局 concurrency
    # append_system_prompt: '你是我的素材收集助手'  # 可选人格补充（多机器人差异化定位的主要手段）
    # env:                    # per-app 环境变量（改后下一条消息热生效；注意：生效目录 settings.json
    #                           的 env 优先级更高，此处适合放 settings.json 里没有的键）
    #   SOME_PLUGIN_KEY: xxx
    # triggers:               # 触发词映射：命中即把消息改写为 rewrite 再入队（按序首个命中生效）。
    #                          # 通常无须配置：未命中触发词的 /xxx 消息会原文透传给 Claude Code
    #                          自动展开斜杠命令（可触发 skills / 插件命令，如 /superpowers:brainstorming）；
    #                          仅在需要改写参数/附加指令时才配触发词。
    #                          match 以 / 开头 = 首 token 精确匹配（/produce 命中、/produced 不命中），
    #                          否则 = 整条消息包含该关键词即命中；{text}=原文全文，{args}=去掉首 token 的剩余参数。
    #                          /stop /new /help 等本地命令永远优先，不会被劫持。改动写盘后下一条消息即热生效。
    #   - match: /produce
    #     rewrite: '调用 content-producer 插件的主技能（skills/content-producer/SKILL.md）执行内容生产流程，严格遵循其编排。任务参数：{args}'
    #   - match: 写文章
    #     rewrite: '调用 content-producer 插件的主技能（skills/content-producer/SKILL.md）执行内容生产流程，严格遵循其编排。任务描述：{text}'
    # plugins:                # 通常无须配置：~/.claude 已启用的插件自动加载（随 CLI 的 /plugin install 变化）。
    #                          显式配置用于开发期直指源码目录（改 SKILL.md 即生效，无需重装）；
    #                          与自动发现同名时显式优先。插件的 MCP/hooks 随之加载。
    #   - name: content-producer
    #     path: F:/workspace/plugins/content-producer/plugin
  # - name: 素材收集           # 再添一个机器人：复制上面的结构即可（会话池独立，配置共享 ~/.claude）
  #   app_id: cli_yyyy
  #   app_secret: yyyy
  # - name: SQL 审核分身       # 分身机器人（role: deputy）：按用途限定能力、艾特即用（无需配对），
  #   app_id: cli_zzzz         # 供他人使用。能力 = 技能白名单 + 插件白名单 + 工作区锁定；
  #   app_secret: zzzz         # 工具权限跟全局 permissions 走。管理命令（/ws use、/model-profile、
  #   role: deputy             # /plugin 变更类、/reload-plugins）在分身里一律拒绝（含 admin 本人）。
  #   allowed_skills:          # 必填：技能白名单——未列出的技能对模型不可见且被 Skill 工具拒绝。
  #     - sql-review           # 注意：SDK 官方语义为「上下文过滤器非沙箱」，技能文件仍可被
  #     - sql-optimize         # Read/Bash 读到；硬隔离需工具级限制（当前版本不做，已知悉边界）
  #   allowed_workspaces:      # 必填：工作区锁定——分身任务恒运行在第一个允许的工作区（本示例
  #     - demo                 #   须替换为 workspaces 列表内的真实工作区）
  #   allowed_plugins:         # 可选：插件白名单（按 name 过滤自动发现，未列出的不加载）；
  #     - db-tools             #   未配置 = 不加载任何自动发现插件（显式 plugins 始终保留）
workspaces:                    # 工作区白名单：名字 + 路径（所有机器人共享列表，当前使用哪个 per-app 隔离）
  - name: demo
    path: F:\workspace\demo
    # 需要「先出方案再执行」时，在飞书会话里发 /plan 按通道切换计划模式；
    # git 仓库工作区任务收尾自动发汇总 diff 卡片（不再整文件上传）
  # - name: my-project
  #   path: F:\workspace\my-project
defaults:
  workspace: demo
concurrency: 3                 # 全局并发上限（未单独配置的 app 沿用此值）
# permissions:                # 工具确认与危险命令（整块可选；未配置的字段用内置默认）。改后热生效
#   allow_all_tools: true     # 全部工具免确认（缺省开）。开启后除命中 dangerous_commands 的
#                             # Bash 外，所有工具（含 Write/Edit）都不再弹确认卡；
#                             # 关闭则回落下面的 allow_tools 白名单语义
#   allow_tools:              # 免确认直通工具名（仅 allow_all_tools 关闭时生效）。
#                             # 配置即整体替换内置默认（不与默认合并）！
#                             # 内置默认 = Read/Glob/Grep/LS/TodoRead/TodoWrite/WebFetch/WebSearch/Bash
#                             # （Bash 默认放行读命令；安全性由 dangerous_commands 黑名单兜底）
#   - Read
#   - Glob
#   - Grep
#   - LS
#   - TodoRead
#   - TodoWrite
#   - WebFetch
#   - WebSearch
#   - Bash
#   dangerous_commands:       # Bash 危险命令正则（对命令全文匹配，命中弹确认卡）；缺省内置
#                             # rm -rf / sudo / git push --force / git reset --hard / mkfs /
#                             # dd if= / chmod 777 / curl|wget 管道执行脚本 / shutdown|reboot
#                             # allow_all_tools 开启时本表是唯一的安全网，删条目前请三思
#   - 'rm\s+-rf'
#   - 'sudo\s'
# server:                     # Web 配置页（随 lcb start 常驻，浏览器打开 http://127.0.0.1:17317 随时改配置；
#                              # 也可 lcb ui 单独启动。整块可选，缺省 enabled/127.0.0.1/17317）
#   enabled: true             # false = 不启动配置页
#   host: 127.0.0.1           # 仅本机可访问；改非回环地址 = 局域网可见（页面可读写全部凭证，慎用）
#   port: 17317
# claude:                     # Claude 认证双模式（整块可选）。缺省/inherit = 共享本机 ~/.claude
#                             # （登录态/模型/MCP/skills/插件全部自动继承，见 README「配置继承」）；
#                             # managed = bridge 托管（无需本机 claude login，一键安装开箱即用）
#   mode: managed
#   auth_token: sk-xxx        # ANTHROPIC_AUTH_TOKEN（中转站常用，Bearer）；与 api_key 二选一
#   # api_key: sk-ant-xxx     # ANTHROPIC_API_KEY（官方，x-api-key）
#   base_url: https://relay.example    # 中转站端点（ANTHROPIC_BASE_URL）；官方 API 留空
#   model: claude-sonnet-5    # 模型（写入托管目录 ~/.lark-claudecode-bridge/claude/settings.json）
#   env:                      # 全局环境变量（全部机器人共享，改后下一条消息热生效）。MCP 工具
#                             # 依赖的变量（如插件 lark-all-mcp 的 LARK_APP_ID/LARK_APP_SECRET）
#                             # 推荐配在这里而非 apps[].env（后者仅单个机器人可见）。inherit 模式
#                             # 并入每任务子进程 env；managed 模式写入托管 settings.json。
#                             # 认证四键（ANTHROPIC_AUTH_TOKEN/API_KEY/BASE_URL/MODEL）不在此生效
#     LARK_APP_ID: cli_xxxx
#     LARK_APP_SECRET: xxxx
# slash_commands:             # 飞书斜杠命令同步（配置页「斜杠命令」tab 一键同步到开放平台；
#                             # 内置命令 help/new/resume/stop/status/ws/model/skills/plugins/mcp/plugin 恒参与，
#                             # 此处仅配置自定义透传命令；需开通 application:app_slash_command 读写权限）
#   extra:
#     - command: produce      # 不带 / 前缀，1-32 位字母/数字/下划线/连字符
#       description: 内容生产流程   # 指令面板展示文案
#       icon: skill_outlined  # 图标（可选，icon_key 列表见飞书文档）
# transcripts:                # 对话落盘清理策略；缺省 = 永久保留
#   retention_days: 90
# session:                    # 会话行为微调；缺省用内置默认
#   context_remind_tokens: 150000   # 上下文超长提醒阈值（tokens，估算口径 = 最后一次回复的输入+缓存规模）；
#                             # 超过才提示「建议 /new」；0 = 关闭提醒。改后下一条消息热生效
# card:                       # 卡片展示（整块可选）；改后下一条消息热生效
#   width: fill               # default = 飞书默认宽度（与消息等宽留边）；fill = 撑满聊天窗口。
#                             # 作用于全部卡片：文本卡/图片卡/进度卡（含确认与问答区）/长回复卡等
# autostart:                 # 开机自启意图记录（概览页「开机自启」开关写入；实际注册状态以 OS 查询
#   enabled: true            # 为权威。Windows 用 Startup 文件夹 / macOS 用 LaunchAgent / Linux 用 systemd --user）
