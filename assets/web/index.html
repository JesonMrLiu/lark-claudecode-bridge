<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lark-claudecode-bridge 配置</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --border: #e2e5ea; --text: #1f2329; --muted: #646a73;
    --primary: #3370ff; --danger: #f54f4f; --ok: #34c724; --warn: #ff8800; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 17px; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  .layout { display: flex; min-height: calc(100vh - 61px); }
  nav { width: 170px; padding: 16px 8px; background: var(--card); border-right: 1px solid var(--border); }
  nav button { display: block; width: 100%; text-align: left; padding: 9px 14px; margin: 2px 0; border: 0; background: none; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--text); }
  nav button:hover { background: var(--bg); }
  nav button.active { background: #eef3ff; color: var(--primary); font-weight: 600; }
  main { flex: 1; padding: 20px 28px; max-width: 980px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card .desc { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=password], input[type=number], select, textarea {
    width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px; font: inherit; background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid #c9d8ff; border-color: var(--primary); }
  textarea { font-family: Consolas, monospace; font-size: 12.5px; min-height: 90px; resize: vertical; }
  .row { display: flex; gap: 12px; } .row > * { flex: 1; }
  .btn { padding: 7px 16px; border-radius: 7px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font: inherit; }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.danger { color: var(--danger); } .btn.danger:hover { border-color: var(--danger); }
  .btn.sm { padding: 3px 10px; font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--border); padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-family: Consolas, monospace; }
  .chip button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0; font-size: 13px; }
  .chip button:hover { color: var(--danger); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 5px; font-size: 11.5px; }
  .tag.ok { background: #e8f7e6; color: var(--ok); } .tag.off { background: var(--bg); color: var(--muted); }
  .tag.warn { background: #fff3e0; color: var(--warn); } .tag.err { background: #fee; color: var(--danger); }
  .radio-row { display: flex; gap: 20px; margin: 8px 0; }
  .radio-row label { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--text); font-size: 13.5px; cursor: pointer; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #2b2f36; color: #fff; padding: 10px 22px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 80vw; }
  #toast.show { opacity: .95; }
  #toast.err { background: var(--danger); }
  .app-card { border: 1px solid var(--border); border-radius: 8px; padding: 4px 16px 14px; margin-bottom: 12px; position: relative; }
  .app-card .del { position: absolute; top: 10px; right: 12px; }
  .hint { font-size: 12px; color: var(--muted); }
  .footer-note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  pre.report { background: #f7f8fa; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 12px; overflow: auto; white-space: pre-wrap; }
  .savebar { position: fixed; right: 24px; bottom: 24px; display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 8px 10px 8px 18px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
  .savebar .state { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>🛵 lark-claudecode-bridge</h1>
  <span class="meta" id="hMeta">加载中…</span>
  <span class="spacer"></span>
  <span class="meta" id="hFirstRun"></span>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="savebar" id="savebar" style="display:none">
  <span class="state" id="saveState">有未保存的修改</span>
  <button class="btn" id="btnReload">放弃修改</button>
  <button class="btn primary" id="btnSave">保存</button>
</div>
<div id="toast"></div>
<script>
'use strict';
// ============ 全局状态 ============
const S = { status: null, doc: null, firstRun: false, dirty: false };
const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = ''; }, isErr ? 6000 : 3200);
}
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body !== undefined ? { 'Content-Type': 'application/json; charset=utf-8' } : undefined,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
function markDirty() {
  S.dirty = true;
  $('#savebar').style.display = 'flex';
}
function clearDirty() {
  S.dirty = false;
  $('#savebar').style.display = 'none';
}

// ============ Tab 注册 ============
const TABS = [
  { key: 'overview', title: '概览' },
  { key: 'apps', title: '应用' },
  { key: 'workspaces', title: '工作区' },
  { key: 'claude', title: 'Claude 认证' },
  { key: 'permissions', title: '权限' },
  { key: 'slash', title: '斜杠命令' },
  { key: 'plugins', title: '插件' },
];
let activeTab = 'overview';
function renderNav() {
  $('#nav').innerHTML = TABS.map((t) =>
    `<button data-k="${t.key}" class="${t.key === activeTab ? 'active' : ''}">${t.title}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach((b) =>
    b.onclick = () => { activeTab = b.dataset.k; render(); });
}
function render() {
  renderNav();
  if (S.firstRun) return renderBootstrap();
  const fn = { overview: renderOverview, apps: renderApps, workspaces: renderWorkspaces,
    claude: renderClaude, permissions: renderPermissions, slash: renderSlash, plugins: renderPlugins }[activeTab];
  $('#main').innerHTML = '';
  fn($('#main'));
}

// ============ 首装向导（bootstrap） ============
function renderBootstrap() {
  $('#main').innerHTML = `
  <div class="card">
    <h3>👋 欢迎使用 lark-claudecode-bridge</h3>
    <div class="desc">首次安装：完成下面三步即可开始使用。需要先在 <a href="https://open.feishu.cn/app" target="_blank">飞书开放平台</a> 创建应用并启用机器人能力（详见 README）。</div>
    <h3 style="margin-top:16px">① 飞书应用凭证</h3>
    <div id="bsApps"></div>
    <button class="btn sm" id="bsAddApp">+ 再添一个应用（多机器人）</button>
    <h3 style="margin-top:20px">② 本机工作区（Claude 的工作目录）</h3>
    <div class="row">
      <div><label>名字（如 demo）</label><input type="text" id="bsWsName" placeholder="demo"></div>
      <div><label>本机绝对路径</label><input type="text" id="bsWsPath" placeholder="F:\\workspace\\demo"></div>
    </div>
    <h3 style="margin-top:20px">③ Claude 认证（可稍后在「Claude 认证」页配置）</h3>
    <div class="radio-row">
      <label><input type="radio" name="bsMode" value="skip" checked> 使用本机已有 ~/.claude 登录</label>
      <label><input type="radio" name="bsMode" value="managed"> 填 API Key / Token（无需本机登录）</label>
    </div>
    <div id="bsManaged" style="display:none">
      <div class="radio-row">
        <label><input type="radio" name="bsCred" value="auth_token" checked> AUTH_TOKEN（中转站常用）</label>
        <label><input type="radio" name="bsCred" value="api_key"> API_KEY（官方）</label>
      </div>
      <div class="row">
        <div><label id="bsCredLabel">Auth Token</label><input type="password" id="bsCred" placeholder="sk-…"></div>
        <div><label>BASE_URL（中转站端点，官方留空）</label><input type="text" id="bsBaseUrl" placeholder="https://relay.example.com"></div>
      </div>
      <label>模型（如 claude-sonnet-5，可留空）</label><input type="text" id="bsModel" placeholder="claude-sonnet-5">
    </div>
    <div style="margin-top:20px">
      <button class="btn primary" id="bsSubmit" style="padding:9px 28px">完成配置</button>
      <span class="hint">提交后运行 <code>lcb start</code> 启动桥接器</span>
    </div>
  </div>`;
  const appsBox = $('#bsApps');
  const addAppRow = () => {
    const div = document.createElement('div');
    div.className = 'row';
    div.style.marginBottom = '8px';
    div.innerHTML = `
      <div><label>App ID（cli_ 开头）</label><input type="text" class="bs-appid" placeholder="cli_aabbccddeeff0011"></div>
      <div><label>应用名字（可空）</label><input type="text" class="bs-name" placeholder="素材收集"></div>
      <div><label>App Secret</label><input type="password" class="bs-secret" placeholder=""></div>
      <div style="flex:0;align-self:end"><button class="btn sm danger bs-del">删除</button></div>`;
    div.querySelector('.bs-del').onclick = () => div.remove();
    appsBox.appendChild(div);
  };
  addAppRow();
  $('#bsAddApp').onclick = addAppRow;
  document.querySelectorAll('input[name=bsMode]').forEach((r) => r.onchange = () => {
    $('#bsManaged').style.display = $('[name=bsMode]:checked').value === 'managed' ? '' : 'none';
  });
  document.querySelectorAll('input[name=bsCred]').forEach((r) => r.onchange = () => {
    $('#bsCredLabel').textContent = $('[name=bsCred]:checked').value === 'api_key' ? 'API Key' : 'Auth Token';
  });
  $('#bsSubmit').onclick = async () => {
    const apps = [...appsBox.querySelectorAll('.row')].map((row) => {
      const appId = row.querySelector('.bs-appid').value.trim();
      const name = row.querySelector('.bs-name').value.trim();
      const secret = row.querySelector('.bs-secret').value.trim();
      return { app_id: appId, ...(name ? { name } : {}), app_secret: secret };
    }).filter((a) => a.app_id && a.app_secret);
    const ws = { name: $('#bsWsName').value.trim(), path: $('#bsWsPath').value.trim() };
    if (!apps.length) return toast('至少需要一个有效的应用（App ID + App Secret）', true);
    if (!ws.name || !ws.path) return toast('工作区名字与路径不能为空', true);
    const body = { apps, workspace: ws };
    if ($('[name=bsMode]:checked').value === 'managed') {
      const cred = $('[name=bsCred]:checked').value;
      const val = $('#bsCred').value.trim();
      if (!val) return toast('请填写 Auth Token / API Key', true);
      body.claude = { mode: 'managed', [cred]: val };
      const baseUrl = $('#bsBaseUrl').value.trim();
      const model = $('#bsModel').value.trim();
      if (baseUrl) body.claude.base_url = baseUrl;
      if (model) body.claude.model = model;
    }
    try {
      const r = await api('POST', '/api/bootstrap', body);
      toast(r.message || '配置完成');
      await refresh();
      toast('✅ 配置已写入，请运行 lcb start（若正在运行请重启）');
    } catch (e) { toast(e.message, true); }
  };
}

// ============ 概览 ============
async function renderOverview(el) {
  const st = S.status || {};
  const claudeTag = st.claude?.hasAuth === null ? '<span class="tag off">未知</span>'
    : st.claude?.hasAuth ? '<span class="tag ok">已就绪</span>' : '<span class="tag err">未认证</span>';
  el.innerHTML = `
  <div class="card">
    <h3>运行状态</h3>
    <table>
      <tr><td>版本</td><td>v${esc(st.version)}</td></tr>
      <tr><td>模式</td><td>${st.embedded ? '随 lcb start 常驻' : 'lcb ui 独立（桥接器未随本页启动）'}</td></tr>
      <tr><td>配置文件</td><td><code>${esc(st.configPath)}</code></td></tr>
      <tr><td>配置页</td><td><code>${esc(location.host)}</code></td></tr>
      <tr><td>Claude 认证</td><td>${claudeTag}（模式：${esc(st.claude?.mode || 'inherit')}）</td></tr>
    </table>
    <div class="desc" style="margin-top:10px">${st.claude?.hasAuth === false ? '⚠️ 未检测到认证：到「Claude 认证」页填写，或在配置页所在机器执行 claude login。' : ''}</div>
  </div>
  <div class="card">
    <h3>机器人应用</h3>
    <table><thead><tr><th>名称</th><th>App ID</th><th>状态</th></tr></thead><tbody>
    ${(st.apps || []).map((a) => `<tr><td>${esc(a.name)}</td><td><code>${esc(a.appId)}</code></td><td>${
      a.started === true ? '<span class="tag ok">运行中</span>' : a.started === false ? '<span class="tag err">启动失败</span>' : '<span class="tag off">未随本页启动</span>'
    }</td></tr>`).join('') || '<tr><td colspan="3" class="hint">无</td></tr>'}
    </tbody></table>
  </div>
  <div class="card">
    <h3>常用指引</h3>
    <div class="desc">飞书端与机器人对话即可使用；<code>/help</code> 查看全部命令。配置修改后：<b>应用 / 认证 / server 段需重启 lcb start</b>，工作区 / 权限 / 触发词下一条消息自动生效。</div>
  </div>`;
}

// ============ 应用 ============
function renderApps(el) {
  const apps = S.doc.apps || (S.doc.apps = []);
  el.innerHTML = `
  <div class="card">
    <h3>飞书应用（机器人）</h3>
    <div class="desc">每个应用一条独立长连接与会话池。App Secret 已脱敏，留空 = 保持不变。triggers / plugins / env 用 JSON 编辑（可留空）。</div>
    <div id="appsBox"></div>
    <button class="btn sm" id="addApp">+ 添加应用</button>
    <div class="footer-note">⚠️ 应用凭证修改需重启 lcb start 后生效。</div>
  </div>`;
  const box = $('#appsBox');
  const renderOne = (app, idx) => {
    const secret = app.app_secret || {};
    const div = document.createElement('div');
    div.className = 'app-card';
    div.innerHTML = `
      <button class="btn sm danger del">删除应用</button>
      <div class="row">
        <div><label>应用名字（显示用）</label><input type="text" data-f="name" value="${esc(app.name || '')}" placeholder="缺省取 App ID"></div>
        <div><label>App ID</label><input type="text" data-f="app_id" value="${esc(app.app_id || '')}" placeholder="cli_…"></div>
        <div><label>App Secret ${secret.secretSet ? `（已设置 ${esc(secret.secretHint)}，留空不改）` : ''}</label>
          <input type="password" data-f="app_secret" value="" placeholder="${secret.secretSet ? '••••••••（留空保持不变）' : '未设置'}"></div>
      </div>
      <div class="row">
        <div><label>域名</label><select data-f="domain">
          <option value="" ${!app.domain || app.domain === 'feishu' ? 'selected' : ''}>feishu（国内）</option>
          <option value="lark" ${app.domain === 'lark' ? 'selected' : ''}>lark（国际）</option>
        </select></div>
        <div><label>默认工作区</label><input type="text" data-f="default_workspace" value="${esc(app.default_workspace || '')}" placeholder="缺省用全局默认"></div>
        <div><label>并发上限（1-100）</label><input type="number" data-f="concurrency" value="${esc(app.concurrency ?? '')}" placeholder="缺省用全局"></div>
      </div>
      <label>人格补充（append_system_prompt，可空）</label>
      <textarea data-f="append_system_prompt" placeholder="你是一个素材收集助手…">${esc(app.append_system_prompt || '')}</textarea>
      <div class="row">
        <div><label>触发词 triggers（JSON，可空）</label><textarea data-f="triggers" class="json" placeholder='[{"match":"/produce","rewrite":"…{args}"}]'>${esc(app.triggers ? JSON.stringify(app.triggers, null, 1) : '')}</textarea></div>
        <div><label>显式插件 plugins（JSON，可空）</label><textarea data-f="plugins" class="json" placeholder='[{"name":"x","path":"F:/…"}]'>${esc(app.plugins ? JSON.stringify(app.plugins, null, 1) : '')}</textarea></div>
      </div>
      <label>环境变量 env（JSON，可空）</label>
      <textarea data-f="env" class="json" placeholder='{"KEY":"value"}'>${esc(app.env ? JSON.stringify(app.env, null, 1) : '')}</textarea>`;
    div.querySelector('.del').onclick = () => {
      if (apps.length <= 1) return toast('至少保留一个应用', true);
      apps.splice(idx, 1);
      markDirty();
      renderApps(el);
    };
    div.querySelectorAll('[data-f]').forEach((input) => {
      input.oninput = () => {
        const f = input.dataset.f;
        if (input.classList.contains('json')) {
          if (!input.value.trim()) { delete app[f]; markDirty(); return; }
          try {
            const v = JSON.parse(input.value);
            if (Array.isArray(v) ? v.length : Object.keys(v).length) app[f] = v; else delete app[f];
            markDirty();
          } catch { /* JSON 未写完，暂不标记 */ }
        } else if (f === 'app_secret') {
          if (input.value.trim()) { app.app_secret = input.value; markDirty(); }
          else { app.app_secret = { secretSet: secret.secretSet }; markDirty(); } // 空串=不修改（后端回填）
        } else if (f === 'concurrency') {
          if (input.value.trim()) app.concurrency = Number(input.value); else delete app.concurrency;
          markDirty();
        } else if (input.value.trim()) {
          app[f] = input.value; markDirty();
        } else if (f !== 'name' && f !== 'app_id') {
          delete app[f]; markDirty();
        } else { app[f] = input.value; markDirty(); }
      };
    });
    box.appendChild(div);
  };
  apps.forEach(renderOne);
  $('#addApp').onclick = () => {
    apps.push({ app_id: '', app_secret: '' });
    markDirty();
    renderApps(el);
  };
}

// ============ 工作区 ============
function renderWorkspaces(el) {
  const doc = S.doc;
  doc.workspaces = doc.workspaces || [];
  el.innerHTML = `
  <div class="card">
    <h3>工作区</h3>
    <div class="desc">Claude 的工作目录白名单。type=code-dev 的开发工作流：先出计划（飞书批准）+ 收尾汇总 diff。</div>
    <table><thead><tr><th style="width:180px">名字</th><th>路径</th><th style="width:120px">类型</th><th style="width:50px"></th></tr></thead>
    <tbody id="wsBody"></tbody></table>
    <button class="btn sm" id="wsAdd" style="margin-top:10px">+ 添加工作区</button>
    <div class="footer-note">运行中的桥接器下一条消息自动生效，无需重启。</div>
  </div>
  <div class="card">
    <h3>全局默认</h3>
    <div class="row">
      <div><label>默认工作区（defaults.workspace）</label><input type="text" id="defWs"></div>
      <div><label>全局并发（concurrency）</label><input type="number" id="globalCc" min="1" max="100"></div>
    </div>
  </div>`;
  const body = $('#wsBody');
  const renderRow = (ws, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" data-f="name" value="${esc(ws.name || '')}"></td>
      <td><input type="text" data-f="path" value="${esc(ws.path || '')}"></td>
      <td><select data-f="type">
        <option value="generic" ${ws.type !== 'code-dev' ? 'selected' : ''}>generic</option>
        <option value="code-dev" ${ws.type === 'code-dev' ? 'selected' : ''}>code-dev</option>
      </select></td>
      <td><button class="btn sm danger">删</button></td>`;
    tr.querySelectorAll('[data-f]').forEach((input) => {
      input.oninput = input.onchange = () => {
        if (input.dataset.f === 'type') { if (input.value === 'code-dev') ws.type = 'code-dev'; else delete ws.type; }
        else ws[input.dataset.f] = input.value;
        markDirty();
      };
    });
    tr.querySelector('.btn').onclick = () => {
      if (doc.workspaces.length <= 1) return toast('至少保留一个工作区', true);
      doc.workspaces.splice(idx, 1);
      markDirty();
      renderWorkspaces(el);
    };
    body.appendChild(tr);
  };
  doc.workspaces.forEach(renderRow);
  $('#wsAdd').onclick = () => { doc.workspaces.push({ name: '', path: '' }); markDirty(); renderWorkspaces(el); };
  $('#defWs').value = doc.defaults?.workspace || '';
  $('#defWs').oninput = () => { doc.defaults = { workspace: $('#defWs').value }; markDirty(); };
  $('#globalCc').value = doc.concurrency ?? 3;
  $('#globalCc').oninput = () => { doc.concurrency = Number($('#globalCc').value) || 3; markDirty(); };
}

// ============ Claude 认证 ============
function renderClaude(el) {
  const c = S.doc.claude || (S.doc.claude = {});
  const mode = c.mode || 'inherit';
  const hasToken = c.auth_token?.secretSet, hasKey = c.api_key?.secretSet;
  const credType = hasToken ? 'auth_token' : 'api_key';
  el.innerHTML = `
  <div class="card">
    <h3>认证模式</h3>
    <div class="radio-row">
      <label><input type="radio" name="mode" value="inherit" ${mode === 'inherit' ? 'checked' : ''}> 继承本机 ~/.claude（已在本机 claude login）</label>
      <label><input type="radio" name="mode" value="managed" ${mode === 'managed' ? 'checked' : ''}> bridge 托管（填 API Key / Token，无需本机登录）</label>
    </div>
    <div id="managedBox" style="${mode === 'managed' ? '' : 'display:none'}">
      <div class="radio-row">
        <label><input type="radio" name="cred" value="auth_token" ${credType === 'auth_token' ? 'checked' : ''}> AUTH_TOKEN（中转站常用，Bearer）</label>
        <label><input type="radio" name="cred" value="api_key" ${credType === 'api_key' ? 'checked' : ''}> API_KEY（官方，x-api-key）</label>
      </div>
      <div class="row">
        <div><label id="credLabel">Auth Token ${hasToken ? `（已设置 ${esc(c.auth_token.secretHint)}，留空不改）` : ''}</label>
          <input type="password" id="credVal" placeholder="${hasToken || hasKey ? '留空保持不变' : 'sk-…'}"></div>
        <div><label>BASE_URL（中转站端点，官方留空）</label><input type="text" id="baseUrl" value="${esc(c.base_url || '')}" placeholder="https://relay.example.com"></div>
      </div>
      <label>模型（写入 settings.json，如 claude-sonnet-5，可留空）</label>
      <input type="text" id="model" value="${esc(c.model || '')}" placeholder="claude-sonnet-5">
    </div>
    <div class="footer-note">managed 模式把认证写入 <code>~/.lark-claudecode-bridge/claude/settings.json</code>，与本机 ~/.claude 完全隔离；认证/模型改动保存后对后续任务即生效，模式切换需重启。</div>
  </div>`;
  document.querySelectorAll('input[name=mode]').forEach((r) => r.onchange = () => {
    c.mode = $('[name=mode]:checked').value;
    $('#managedBox').style.display = c.mode === 'managed' ? '' : 'none';
    markDirty();
  });
  const updCredLabel = () => {
    const v = $('[name=cred]:checked').value;
    $('#credLabel').innerHTML = (v === 'api_key' ? 'API Key' : 'Auth Token')
      + (v === 'auth_token' && hasToken ? `（已设置 ${esc(c.auth_token.secretHint)}，留空不改）` : '')
      + (v === 'api_key' && hasKey ? `（已设置 ${esc(c.api_key.secretHint)}，留空不改）` : '');
  };
  document.querySelectorAll('input[name=cred]').forEach((r) => r.onchange = () => { updCredLabel(); markDirty(); });
  $('#credVal').oninput = () => {
    const v = $('#credVal').value.trim();
    const key = $('[name=cred]:checked').value;
    const other = key === 'auth_token' ? 'api_key' : 'auth_token';
    if (v) { c[key] = v; c[other] = ''; } else { c[key] = { secretSet: key === 'auth_token' ? hasToken : hasKey }; }
    markDirty();
  };
  $('#baseUrl').oninput = () => { c.base_url = $('#baseUrl').value.trim() || undefined; markDirty(); };
  $('#model').oninput = () => { c.model = $('#model').value.trim() || undefined; markDirty(); };
}

// ============ 权限 ============
function renderPermissions(el) {
  const p = S.doc.permissions || (S.doc.permissions = {});
  p.allow_tools = p.allow_tools || [];
  p.dangerous_commands = p.dangerous_commands || [];
  el.innerHTML = `
  <div class="card">
    <h3>免确认工具白名单（allow_tools）</h3>
    <div class="desc">名单内工具直接放行不弹确认卡（配置即整体替换内置默认）。Bash 仍受危险命令黑名单约束。</div>
    <div class="chips" id="toolChips"></div>
    <div class="row" style="max-width:420px">
      <input type="text" id="newTool" placeholder="工具名，如 Write">
      <button class="btn sm" id="addTool" style="flex:0">添加</button>
    </div>
  </div>
  <div class="card">
    <h3>Bash 危险命令黑名单（dangerous_commands）</h3>
    <div class="desc">正则源串（不区分大小写），命中即弹确认卡。删除正则 = 放宽对应命令为直通，请谨慎。</div>
    <table><tbody id="dcBody"></tbody></table>
    <div class="row" style="max-width:640px;margin-top:8px">
      <input type="text" id="newDc" placeholder="正则源串，如 \\bgit\\s+push\\b.*--force">
      <button class="btn sm" id="addDc" style="flex:0">添加</button>
    </div>
    <div class="footer-note">权限改动经热重载对下一条消息生效（新通道/重启后全量生效）。</div>
  </div>`;
  const renderChips = () => {
    $('#toolChips').innerHTML = p.allow_tools.map((t, i) =>
      `<span class="chip">${esc(t)}<button data-i="${i}">✕</button></span>`).join('');
    $('#toolChips').querySelectorAll('button').forEach((b) =>
      b.onclick = () => { p.allow_tools.splice(Number(b.dataset.i), 1); markDirty(); renderPermissions(el); });
  };
  renderChips();
  $('#addTool').onclick = () => {
    const v = $('#newTool').value.trim();
    if (!v) return;
    if (!p.allow_tools.includes(v)) p.allow_tools.push(v);
    markDirty(); renderPermissions(el);
  };
  const renderDc = () => {
    $('#dcBody').innerHTML = p.dangerous_commands.map((s, i) => `
      <tr><td style="width:90%"><code>${esc(s)}</code></td><td><button class="btn sm danger" data-i="${i}">删除</button></td></tr>`).join('');
    $('#dcBody').querySelectorAll('button').forEach((b) =>
      b.onclick = () => { p.dangerous_commands.splice(Number(b.dataset.i), 1); markDirty(); renderPermissions(el); });
  };
  renderDc();
  $('#addDc').onclick = () => {
    const v = $('#newDc').value.trim();
    if (!v) return;
    try { new RegExp(v, 'i'); } catch (e) { return toast(`正则无效：${e.message}`, true); }
    p.dangerous_commands.push(v);
    markDirty(); renderPermissions(el);
  };
}

// ============ 斜杠命令（extras 编辑 + 一键同步） ============
function renderSlash(el) {
  const sc = S.doc.slash_commands || (S.doc.slash_commands = {});
  sc.extra = sc.extra || [];
  el.innerHTML = `
  <div class="card">
    <h3>飞书斜杠命令</h3>
    <div class="desc">同步后在飞书聊天输入 <code>/</code> 弹出指令面板，选中后命令留在输入框可继续输入描述再发送。<b>内置命令</b>（help/new/resume/stop/status/ws/model/skills/plugins/mcp）始终参与同步；下表为自定义透传命令。</div>
    <table><thead><tr><th style="width:160px">命令（不带 /）</th><th>描述</th><th style="width:150px">图标 icon_key（可空）</th><th style="width:50px"></th></tr></thead>
    <tbody id="scBody"></tbody></table>
    <button class="btn sm" id="scAdd" style="margin-top:10px">+ 添加命令</button>
  </div>
  <div class="card">
    <h3>一键同步到飞书</h3>
    <div class="desc">需在飞书开放平台给应用开通 <code>application:app_slash_command:write/read</code> 权限并发布版本。同步为全量对齐（远端多余命令会被删除）；生效约 5 分钟，PC 端需 7.70+。<b>表格改动请先保存再同步</b>。</div>
    <div class="row" style="align-items:end;max-width:560px">
      <div><label>目标应用</label><select id="syncApp"></select></div>
      <button class="btn" id="btnRemote" style="flex:0">查看远端</button>
      <button class="btn primary" id="btnSync" style="flex:0">一键同步</button>
    </div>
    <div id="syncReport" style="margin-top:12px"></div>
  </div>`;
  const body = $('#scBody');
  const renderRow = (item, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" data-f="command" value="${esc(item.command || '')}" placeholder="produce"></td>
      <td><input type="text" data-f="description" value="${esc(item.description || '')}" placeholder="内容生产流程"></td>
      <td><input type="text" data-f="icon" value="${esc(item.icon || '')}" placeholder="skill_outlined"></td>
      <td><button class="btn sm danger">删</button></td>`;
    tr.querySelectorAll('[data-f]').forEach((input) => input.oninput = () => {
      if (input.dataset.f === 'icon') { if (input.value.trim()) item.icon = input.value.trim(); else delete item.icon; }
      else item[input.dataset.f] = input.value.trim();
      markDirty();
    });
    tr.querySelector('.btn').onclick = () => { sc.extra.splice(idx, 1); markDirty(); renderSlash(el); };
    body.appendChild(tr);
  };
  sc.extra.forEach(renderRow);
  $('#scAdd').onclick = () => { sc.extra.push({ command: '', description: '' }); markDirty(); renderSlash(el); };
  // 同步区块
  const appSel = $('#syncApp');
  (S.status?.apps || []).forEach((a) => {
    const opt = document.createElement('option');
    opt.value = a.name;
    opt.textContent = `${a.name}（${a.appId}）`;
    appSel.appendChild(opt);
  });
  const showReport = (title, content, isErr) => {
    $('#syncReport').innerHTML = `<div class="hint" style="margin-bottom:6px">${title}</div><pre class="report">${esc(content)}</pre>${isErr ? '' : ''}`;
  };
  $('#btnRemote').onclick = async () => {
    try {
      showReport('查询中…', '');
      const r = await api('GET', `/api/slash-commands/remote?app=${encodeURIComponent(appSel.value)}`);
      showReport(`远端已注册 ${r.remote.length} 条`, r.remote.map((x) => `/${x.command} — ${x.description?.default_value || ''}`).join('\n') || '（空）', false);
    } catch (e) { showReport('查询失败', e.message, true); toast(e.message, true); }
  };
  $('#btnSync').onclick = async () => {
    if (S.dirty) return toast('有未保存的修改，请先保存再同步', true);
    $('#btnSync').disabled = true;
    try {
      const r = await api('POST', '/api/slash-commands/sync', { app: appSel.value });
      const lines = [
        r.created.length ? `✅ 新建 ${r.created.length}：${r.created.join('、')}` : '· 无新建',
        r.updated.length ? `🔄 更新 ${r.updated.length}：${r.updated.join('、')}` : '· 无更新',
        r.deleted.length ? `🗑️ 删除 ${r.deleted.length}：${r.deleted.join('、')}` : '· 无删除',
        `✔️ 未变 ${r.unchanged.length} 条`,
        ...(r.errors.length ? [`⚠️ 失败 ${r.errors.length}：`, ...r.errors.map((e) => `  ${e.command}: ${e.error}`)] : []),
      ];
      showReport(`同步完成（约 5 分钟后飞书客户端生效）`, lines.join('\n'), r.errors.length > 0);
      toast(r.errors.length ? `同步完成，但有 ${r.errors.length} 条失败（详见报告）` : '✅ 同步完成，约 5 分钟后生效');
    } catch (e) { showReport('同步失败', e.message, true); toast(e.message, true); }
    $('#btnSync').disabled = false;
  };
}

// ============ 插件 ============
async function renderPlugins(el) {
  el.innerHTML = `
  <div class="card">
    <h3>Claude Code 插件</h3>
    <div class="desc">安装到当前认证模式对应的 Claude 配置目录：<code id="pluginDir">…</code>。装好后下一条消息自动加载。飞书端同样可用 <code>/plugin install xxx@marketplace</code>（仅管理员）。</div>
    <table><thead><tr><th>插件</th><th>市场</th><th>版本</th><th style="width:90px">状态</th><th style="width:200px">操作</th></tr></thead>
    <tbody id="plBody"><tr><td colspan="5" class="hint">加载中…</td></tr></tbody></table>
  </div>
  <div class="card">
    <h3>安装 / 市场</h3>
    <div class="row" style="max-width:560px">
      <input type="text" id="plInstall" placeholder="name 或 name@marketplace">
      <button class="btn primary" id="plDoInstall" style="flex:0">安装</button>
    </div>
    <div class="row" style="max-width:560px;margin-top:10px">
      <input type="text" id="plMarket" placeholder="marketplace git 地址或本机路径">
      <button class="btn" id="plDoMarketAdd" style="flex:0">添加市场</button>
      <button class="btn" id="plDoMarketUpdate" style="flex:0">全部更新</button>
    </div>
    <pre class="report" id="plReport" style="display:none;margin-top:12px"></pre>
  </div>`;
  const report = (title, text) => {
    $('#plReport').style.display = '';
    $('#plReport').textContent = `${title}\n${text}`;
  };
  const load = async () => {
    try {
      const r = await api('GET', '/api/plugins');
      $('#pluginDir').textContent = r.configDir;
      const body = $('#plBody');
      if (!r.plugins.length) {
        body.innerHTML = '<tr><td colspan="5" class="hint">尚未安装任何插件</td></tr>';
        return;
      }
      body.innerHTML = r.plugins.map((p) => `
        <tr>
          <td><b>${esc(p.name)}</b></td>
          <td>${esc(p.marketplace || '-')}</td>
          <td class="hint">${esc(p.version || '-')}</td>
          <td>${p.enabled ? '<span class="tag ok">已启用</span>' : '<span class="tag off">未启用</span>'}</td>
          <td>
            <button class="btn sm" data-op="${p.enabled ? 'disable' : 'enable'}" data-arg="${esc(p.key)}">${p.enabled ? '停用' : '启用'}</button>
            <button class="btn sm danger" data-op="uninstall" data-arg="${esc(p.key)}">卸载</button>
          </td>
        </tr>`).join('');
      body.querySelectorAll('button[data-op]').forEach((b) => b.onclick = () => act(b.dataset.op, b.dataset.arg));
    } catch (e) {
      $('#plBody').innerHTML = `<tr><td colspan="5" class="hint">加载失败：${esc(e.message)}</td></tr>`;
    }
  };
  const act = async (op, arg) => {
    report(`执行中：${op} ${arg}`, '…（安装/更新可能需要拉取仓库，请稍候）');
    try {
      const r = await api('POST', '/api/plugins/action', { op, arg });
      report(r.ok ? `✅ ${op} 完成` : `❌ ${op} 失败`, r.text);
      if (r.ok) { await load(); toast(`${op} 完成`); }
      else toast(`${op} 失败：${r.text.slice(0, 120)}`, true);
    } catch (e) { report(`❌ ${op} 失败`, e.message); toast(e.message, true); }
  };
  $('#plDoInstall').onclick = () => act('install', $('#plInstall').value.trim());
  $('#plDoMarketAdd').onclick = () => act('marketplace-add', $('#plMarket').value.trim());
  $('#plDoMarketUpdate').onclick = () => act('marketplace-update', '');
  await load();
}

// ============ 保存 ============
async function save() {
  if (S.firstRun) return;
  try {
    const r = await api('PUT', '/api/config', S.doc);
    clearDirty();
    if (r.restartRequired?.length) {
      toast(`已保存。注意：${r.restartRequired.join('、')} 段改动需重启 lcb start 后生效`, true);
    } else {
      toast('已保存（运行中的桥接器下一条消息自动生效）');
    }
    await refresh();
  } catch (e) { toast(`保存失败：${e.message}`, true); }
}

// ============ 初始化 ============
async function refresh() {
  S.status = await api('GET', '/api/status').catch(() => null);
  try {
    S.doc = await api('GET', '/api/config');
    S.firstRun = false;
    $('#hFirstRun').textContent = '';
  } catch (e) {
    if (String(e.message).includes('bootstrap')) {
      S.firstRun = true;
      S.doc = null;
      $('#hFirstRun').textContent = '首次安装向导';
    } else { throw e; }
  }
  const st = S.status || {};
  $('#hMeta').textContent = `v${st.version || '?'} · ${location.host}`;
  render();
}
$('#btnSave').onclick = save;
$('#btnReload').onclick = async () => { await refresh(); clearDirty(); toast('已还原为磁盘配置'); };
refresh().catch((e) => { $('#main').innerHTML = `<div class="card"><h3>加载失败</h3><div class="desc">${esc(e.message)}</div></div>`; });
</script>
</body>
</html>
