<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>飞书 Claude Code 桥接器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233370ff'/%3E%3Cg stroke='%23fff' stroke-width='1.9' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 7 5.5 9.5 8 12'/%3E%3Cpath d='M5.5 9.5H15'/%3E%3Cpath d='M16 12 18.5 14.5 16 17'/%3E%3Cpath d='M18.5 14.5H9'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg></span>
    <h1>飞书 Claude Code 桥接器</h1>
  </div>
  <span class="meta" id="hMeta">加载中…</span>
  <span class="spacer"></span>
  <div class="theme-switch" id="themeSwitch" role="group" aria-label="界面风格">
    <button data-opt="auto" title="跟随系统"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg></button>
    <button data-opt="light" title="亮色风格"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.3 11.3 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.3-11.3 1.4-1.4"/></svg></button>
    <button data-opt="dark" title="暗色风格"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
  </div>
  <span class="meta" id="hFirstRun"></span>
</header>
<div class="stale-bar" id="staleBar" hidden>⚠️ 配置页服务进程为旧版本（页面文件已更新）：进程启停 / 重启 / 一键更新需重启桥接器（<code>lcb start</code> 或页面所在进程）后可用。</div>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="drawer-mask" id="drawerMask" hidden>
  <aside class="drawer" role="dialog" aria-modal="true">
    <header><h3 id="drawerTitle"></h3><button class="btn" id="drawerClose">✕ 关闭</button></header>
    <div class="drawer-body" id="drawerBody"></div>
    <footer class="drawer-foot" id="drawerFoot"></footer>
  </aside>
</div>
<div id="toast"></div>
<script>
// 模块加载失败兜底：旧进程（npm 升级后未重启）没有 /js 路由 → main.js 404 → 页面全空，
// 此内联提示替代 staleBar 的职责（staleBar 依赖 JS 运行，模块没加载出来时它也无法显示）
window.__lcbBooted = false;
setTimeout(() => { if (!window.__lcbBooted)
  document.getElementById('main').innerHTML =
  '<div class="card"><h3>页面资源加载失败</h3><div class="desc">配置页服务进程为旧版本，请重启桥接器（lcb start）后刷新本页。</div></div>'; }, 3000);
</script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
