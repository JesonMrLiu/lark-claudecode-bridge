<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!--<title>飞书 Claude Code 桥接器</title>-->
<title>Magpie Harness</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233370ff'/%3E%3Cg stroke='%23fff' stroke-width='1.9' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 7 5.5 9.5 8 12'/%3E%3Cpath d='M5.5 9.5H15'/%3E%3Cpath d='M16 12 18.5 14.5 16 17'/%3E%3Cpath d='M18.5 14.5H9'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg></span>
    <h1>Magpie Harness</h1>
  </div>
  <span class="pill" id="hVer" hidden></span>
  <span class="pill" id="hHost" hidden></span>
  <span class="sp"></span>
  <button class="theme-btn" id="lockBtn" title="锁定配置页" aria-label="锁定配置页" hidden></button>
  <button class="theme-btn" id="settingsBtn" title="设置（密码 / 自动锁屏）" aria-label="设置（密码 / 自动锁屏）" hidden></button>
  <button class="theme-btn" id="themeBtn" title="切换亮 / 暗" aria-label="切换主题"></button>
</header>
<div class="stale-bar" id="staleBar" hidden>⚠️ 配置页服务进程为旧版本（页面文件已更新）：进程启停 / 重启 / 一键更新需重启桥接器（<code>lcb start</code> 或页面所在进程）后可用。</div>
<div class="layout">
  <nav class="sidenav" id="nav"></nav>
  <main>
    <div class="page-head" id="pageHead" hidden></div>
    <div id="view"></div>
    <div class="mini-note" id="pageLegend" hidden></div>
  </main>
</div>
<div class="mask" id="drawerMask" hidden>
  <aside class="drawer" role="dialog" aria-modal="true" id="drawerBox">
    <div class="drawer-resize" id="drawerResize" title="拖拽调宽 · 双击恢复默认" aria-hidden="true"></div>
    <header><h3 id="drawerTitle"></h3><button class="btn ghost" id="drawerClose" aria-label="关闭">✕</button></header>
    <div class="drawer-body" id="drawerBody"></div>
    <footer class="drawer-foot" id="drawerFoot"></footer>
  </aside>
</div>
<div class="mask center" id="modalMask" hidden>
  <div class="modal" role="dialog" aria-modal="true" id="modalBox">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="btn ghost" id="modalClose" aria-label="关闭">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
<div class="lockmask" id="lockMask" hidden>
  <div class="lockcard" id="lockCard">
    <span class="lock-logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
    <h3>配置页已锁定</h3>
    <div class="lock-sub">请输入密码解锁配置页</div>
    <input type="password" id="lockPwd" placeholder="••••••" autocomplete="off">
    <div class="lock-err" id="lockErr"></div>
    <button class="btn primary" id="lockUnlock" style="width:100%;justify-content:center">解锁</button>
    <div class="lock-tip">每次进入配置页都需要输入密码 · 长时间无操作会自动锁屏<br>密码在页面右上角「⚙ 设置」中修改；忘记密码可在本机终端执行 <code>lcb reset-password</code> 恢复初始密码 123456</div>
  </div>
</div>
<div id="toast" role="status"></div>
<script>
// 模块加载失败兜底：旧进程（npm 升级后未重启）没有 /js 路由 → main.js 404 → 页面全空，
// 此内联提示替代 staleBar 的职责（staleBar 依赖 JS 运行，模块没加载出来时它也无法显示）
window.__lcbBooted = false;
setTimeout(() => { if (!window.__lcbBooted)
  document.getElementById('view').innerHTML =
  '<div class="card"><h3>页面资源加载失败</h3><div class="desc">配置页服务进程为旧版本，请重启桥接器（lcb start）后刷新本页。</div></div>'; }, 3000);
</script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
